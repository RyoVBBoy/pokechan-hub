<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Kid/s フィード V3.1</title>
<!--
  Game Kid/s フィード V3.1（デザインの見本 2026-11-17）
  ・V3 の見た目の方向を「独自の記号・情報そのものを見せる・複数ゲームの作り」で磨いたもの。V3 は ../v3/ にそのまま残す。
  ・ゲームの公式の絵・アイコン・ロゴは使わない。ポケモンは当サイトの「種族値の形」を元にした独自の印（シジル）で描く。
  ・「架空の対戦ゲーム（見本）」は複数のゲームに広げられることを確かめるための作りものの例。実在のゲームではない。
  ・このファイルだけで開ける。サイトのロゴ（src/static/logo.png、依頼主のもの）だけ埋め込む。
  ・黄色い点線の部品（上の見本バー・設計メモ・「見本」の知らせ）は見本だけのもの。
-->
<style>
/* =====================================================================
   0. 共通のトークン（Game Kid/s の土台。どのゲームでも同じ）
   ===================================================================== */
.app{
  --canvas:#12141B;
  --card:rgba(28,31,42,.86); --card-solid:#1C1F2A; --inset:rgba(255,255,255,.042); --inset-2:rgba(255,255,255,.072);
  --raised:#252937; --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.08);
  --hl:inset 0 1px 0 rgba(255,255,255,.06);
  --sh-1:0 1px 2px rgba(0,0,0,.28),0 12px 30px -8px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.3),0 24px 52px -12px rgba(0,0,0,.6);
  --t1:#ECEEF4; --t2:#B3B8C7; --t3:#7F8597; --t4:#5C6274;
  --brand:#7C6CF0; --brand-ink:#fff; --brand-tx:#B4A9FF; --brand-rgb:124,108,240;
  --pos:#4FD1A0; --pos-soft:rgba(79,209,160,.13); --neg:#F0727C; --neg-soft:rgba(240,114,124,.12); --warm:244,150,96; --like:#F2668B;
  --chip-a:.15; --chip-a2:.24; --grain-o:.05;
  color-scheme:dark;
}
.app[data-theme=light]{
  --canvas:#ECEEF3;
  --card:rgba(255,255,255,.92); --card-solid:#FFFFFF; --inset:#F3F4F8; --inset-2:#EAECF2;
  --raised:#FFFFFF; --hover:rgba(20,24,40,.04); --press:rgba(20,24,40,.07);
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --sh-1:0 1px 2px rgba(22,26,44,.05),0 10px 28px -10px rgba(22,26,44,.14);
  --sh-2:0 2px 6px rgba(22,26,44,.08),0 24px 50px -12px rgba(22,26,44,.22);
  --t1:#151824; --t2:#4C5366; --t3:#737A8D; --t4:#9AA0B1;
  --brand:#5F52E0; --brand-tx:#4B3FCF; --brand-rgb:95,82,224;
  --pos:#13936A; --pos-soft:rgba(19,147,106,.10); --neg:#D24652; --neg-soft:rgba(210,70,82,.09); --warm:226,104,52; --like:#D93A68;
  --chip-a:.12; --chip-a2:.2; --grain-o:.035;
  color-scheme:light;
}
.app{--fs-title:22px;--fs-name:15px;--fs-body:15.5px;--lh-body:1.74;--fs-meta:13px;--fs-label:11.5px;--fs-mod:14px;--pad:22px;--gap:16px;--r-card:22px;--r-mod:16px}
.app.m{--fs-title:20px;--fs-name:15px;--fs-body:15px;--lh-body:1.7;--fs-meta:12.5px;--fs-label:11px;--fs-mod:13.5px;--pad:16px;--gap:12px;--r-card:22px;--r-mod:14px}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0C10;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;color:#e8e8ee}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app :focus-visible{outline:2px solid var(--brand-tx);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pt{font-feature-settings:"palt"}/* 日本語の見出しは字間を詰める */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =====================================================================
   見本のバー（本番には出ない）
   ===================================================================== */
.pv{position:fixed;inset:0 0 auto 0;height:48px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 12px;background:#17181E;border-bottom:2px dashed #F5D547;font-size:12.5px;color:#d9d9e2;overflow-x:auto;scrollbar-width:none}
.pv::-webkit-scrollbar{display:none}
.pv .tag{flex:none;background:#F5D547;color:#2a2300;font-weight:900;font-size:11px;padding:3px 8px;border-radius:5px}
.pv .g{display:flex;gap:2px;background:#25262E;border-radius:9px;padding:3px;flex:none}
.pv .g button{padding:5px 10px;border-radius:7px;color:#a9a9b6;white-space:nowrap}
.pv .g button[aria-pressed=true]{background:#43444F;color:#fff;font-weight:700}
.pv .lbl{flex:none;color:#8c8c98;font-size:11.5px}
.pv .sp{flex:1}
.pv .x{flex:none;padding:5px 10px;border-radius:8px;border:1.5px dashed #F5D547;color:#F5D547;font-weight:800;white-space:nowrap}
.pv .x[aria-pressed=true]{background:#F5D547;color:#2a2300}
.show-vis [data-vis]{outline:1.5px dashed #F5D547!important;outline-offset:2px}
.notes{position:fixed;top:48px;right:0;bottom:0;width:390px;max-width:100vw;z-index:99;background:#17181E;color:#dcdce4;border-left:2px dashed #F5D547;padding:16px 18px 40px;overflow:auto;font-size:13px;line-height:1.7;transform:translateX(104%);transition:transform .25s;visibility:hidden}
.notes.on{transform:none;visibility:visible}
.notes h2{font-size:14px;margin:0 0 6px;color:#fff}
.notes h3{font-size:11px;letter-spacing:.08em;color:#8d8d99;margin:18px 0 6px}
.notes p{margin:0 0 8px}
.notes code{background:#24252c;padding:1px 5px;border-radius:4px;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;transition:.22s;z-index:120;display:flex;gap:10px;align-items:center;background:#1E1F27;color:#fff;padding:10px 16px 10px 10px;border-radius:12px;font-size:13px;border-left:4px solid #F5D547;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;max-width:calc(100vw - 24px)}
.toast b{background:#F5D547;color:#2a2300;font-size:10.5px;padding:2px 6px;border-radius:4px;flex:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* =====================================================================
   舞台・背景（4つのプリセット＋画像）
   ===================================================================== */
.stage{position:fixed;inset:48px 0 0 0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.stage.phone{padding:28px 0 56px;background:radial-gradient(60% 50% at 50% 0,#1d1e28,#0B0C10 70%)}
.app{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;color:var(--t1);background:var(--canvas);transition:background-color .3s}
.stage.phone .app{width:390px;height:844px;flex:none;border-radius:48px;box-shadow:0 0 0 10px #050507,0 0 0 11px #2a2b33,0 40px 100px rgba(0,0,0,.6)}
.stage.bare{padding:0}
.stage.bare .app{width:100%;height:100%;border-radius:0;box-shadow:none}
.app.m{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
.stage.phone .app.m{--sat:47px;--sab:34px}
.bg,.bg-img,.grain{position:absolute;inset:0;pointer-events:none}
.bg{z-index:-4}.bg-img{z-index:-3;background-size:cover;background-position:center;opacity:0;transition:opacity .25s}
.grain{z-index:-2;background:var(--noise);background-size:200px 200px;opacity:var(--grain-o);mix-blend-mode:overlay}
.app[data-theme=light] .grain{mix-blend-mode:multiply}
.bg.atmos{background:
  radial-gradient(58% 44% at 100% 0%,rgba(var(--brand-rgb),.24),transparent 72%),
  radial-gradient(40% 30% at 0% 0%,rgba(var(--game-rgb),.07),transparent 70%),
  radial-gradient(70% 50% at 50% 118%,rgba(0,0,0,.28),transparent 70%),var(--canvas)}
.app[data-theme=light] .bg.atmos{background:radial-gradient(58% 44% at 100% 0%,rgba(var(--brand-rgb),.14),transparent 72%),radial-gradient(40% 30% at 0% 0%,rgba(var(--game-rgb),.08),transparent 70%),var(--canvas)}
.bg.mesh{background:radial-gradient(42% 38% at 12% 8%,rgba(var(--brand-rgb),.2),transparent 70%),radial-gradient(38% 34% at 92% 14%,rgba(64,150,210,.12),transparent 70%),radial-gradient(46% 40% at 70% 96%,rgba(190,96,160,.10),transparent 72%),radial-gradient(40% 40% at 4% 86%,rgba(72,170,150,.07),transparent 70%),var(--canvas)}
.app[data-theme=light] .bg.mesh{background:radial-gradient(42% 38% at 12% 8%,rgba(var(--brand-rgb),.13),transparent 70%),radial-gradient(38% 34% at 92% 14%,rgba(64,150,210,.10),transparent 70%),radial-gradient(46% 40% at 70% 96%,rgba(210,110,170,.08),transparent 72%),var(--canvas)}
.bg.slate{background:var(--canvas)}
.bg.noise{background:var(--canvas)}
.app.bgn .grain{opacity:calc(var(--grain-o)*2.4)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;overscroll-behavior:contain}

/* =====================================================================
   レイアウト（PC 3列・スマホ1列）
   ===================================================================== */
.d-grid{display:grid;grid-template-columns:260px minmax(0,640px) 320px;gap:32px;justify-content:center;padding:0 28px;min-height:100%}
.app.m .d-grid{display:block;padding:0}
@media (max-width:1300px){.app:not(.m) .d-grid{grid-template-columns:76px minmax(0,640px);gap:24px}.app:not(.m) .side{display:none}
  .app:not(.m) .rail .lb,.app:not(.m) .rail .wm,.app:not(.m) .rail .me-t,.app:not(.m) .rail .gctx{display:none}.app:not(.m) .rail .ni,.app:not(.m) .rail .compose{justify-content:center;padding:0}}
.rail{position:sticky;top:0;height:100vh;max-height:calc(100vh - 48px);padding:26px 0 22px;display:flex;flex-direction:column;gap:4px}
.app.m .rail{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:0 14px 18px}
.mk{width:30px;height:30px;background:var(--t1);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.wm{font-weight:800;font-size:18px;letter-spacing:-.01em}
.wm span{color:var(--t3);font-weight:600}
/* いま見ているゲーム（ゲームごとの色は、ここと印の中だけに使う） */
.gctx{display:flex;align-items:center;gap:10px;margin:0 6px 18px;padding:10px 12px;border-radius:14px;background:var(--inset);font-size:12.5px;color:var(--t2)}
.gctx b{display:block;font-size:13.5px;color:var(--t1);font-weight:700}
.gctx small{display:block;font-size:11.5px;color:var(--t3)}
.gglyph{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(var(--game-rgb),.16);color:rgb(var(--game-rgb))}
.gglyph svg{width:18px;height:18px}
.ni{position:relative;display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;border-radius:14px;color:var(--t2);font-size:15.5px;transition:background .15s,color .15s}
.ni:hover{background:var(--hover);color:var(--t1)}
.ni[aria-current=page]{color:var(--t1);font-weight:700;background:var(--card);box-shadow:var(--hl),var(--sh-1)}
.ni[aria-current=page] svg{color:var(--brand-tx)}
.ni svg.i{width:22px;height:22px}
.ni .ct{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--t2);background:var(--inset-2);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px}
.compose{margin-top:18px;height:52px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:750;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -8px rgba(var(--brand-rgb),.65),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s,filter .15s}
.compose:hover{filter:brightness(1.07)}.compose:active{transform:scale(.98)}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px}
.me:hover{background:var(--hover)}
.me b{display:block;font-size:14.5px}.me small{display:block;color:var(--t3);font-size:12.5px}
.feed{min-width:0;padding-bottom:80px}
.side{position:sticky;top:0;height:calc(100vh - 48px);overflow:auto;padding:26px 0 24px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}

.fh{position:sticky;top:0;z-index:20;padding:24px 12px 14px;margin:0 -12px}
.fh::before,.app.m .m-top::before{content:'';position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--canvas) 84%,transparent);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.fh::after,.app.m .m-top::after{content:'';position:absolute;left:0;right:0;bottom:-18px;height:18px;z-index:-1;background:linear-gradient(color-mix(in srgb,var(--canvas) 84%,transparent),transparent);pointer-events:none}
.fh-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.fh h1{font-size:var(--fs-title);font-weight:800;letter-spacing:-.01em;margin:0;flex:1}
.seg{display:inline-flex;background:var(--inset);border-radius:12px;padding:3px;box-shadow:var(--hl)}
.seg button{height:34px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--t3);transition:background .15s,color .15s}
.seg button[aria-selected=true]{background:var(--raised);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:650;color:var(--t2);transition:background .15s,color .15s}
.cat:hover{background:var(--hover);color:var(--t1)}
.cat[aria-pressed=true]{background:var(--card);color:var(--t1);box-shadow:var(--hl),var(--sh-1)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

/* =====================================================================
   共通の部品：面・投稿欄・ボタン
   ===================================================================== */
.sf{background:var(--card);border-radius:var(--r-card);box-shadow:var(--hl),var(--sh-1)}
.list{display:flex;flex-direction:column;gap:var(--gap)}
.cmp{padding:18px 20px 14px;display:flex;gap:14px;margin-bottom:var(--gap)}
.cmp .b{flex:1;min-width:0}
.cmp textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:16.5px;line-height:1.55;padding:8px 0 6px;min-height:56px;color:var(--t1)}
.cmp textarea::placeholder,.sheet textarea::placeholder{color:var(--t4)}
.tb{display:flex;align-items:center;gap:2px;margin-top:6px}
.tb .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t2);transition:background .15s,color .15s}
.tb .ic:hover{background:var(--hover);color:var(--t1)}
.catpick{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;margin-left:6px;border-radius:11px;background:var(--inset);font-size:13px;font-weight:650;color:var(--t2)}
.catpick:hover{color:var(--t1)}
.tb .sp{flex:1}
.cnt{font-size:12px;color:var(--t3);margin-right:12px}
.cnt.over{color:var(--neg);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:750;transition:filter .15s,transform .15s,opacity .15s}
.btn-p{background:var(--brand);color:var(--brand-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn-p:hover{filter:brightness(1.07)}.btn-p:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-q{background:var(--inset-2);color:var(--t1);height:34px;font-size:13px;padding:0 14px}
.btn-q:hover{background:var(--press)}
.menu{position:absolute;z-index:40;min-width:240px;padding:6px;border-radius:16px;background:var(--raised);box-shadow:var(--hl),var(--sh-2);display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;text-align:left;font-size:14px;font-weight:600}
.menu button:hover{background:var(--hover)}
.menu small{margin-left:auto;color:var(--t3);font-weight:500;font-size:12px}
.menu .ck{margin-left:auto;color:var(--brand-tx)}

/* =====================================================================
   投稿（共通の骨組み）
   ===================================================================== */
.post{padding:var(--pad) var(--pad) 10px;position:relative}
.enter .post{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.post.new{animation:pin 1s ease}
@keyframes pin{from{box-shadow:var(--hl),0 0 0 2px rgba(var(--brand-rgb),.45),var(--sh-1)}to{box-shadow:var(--hl),0 0 0 2px transparent,var(--sh-1)}}
.ph{display:flex;align-items:center;gap:12px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:750;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pm{flex:1;min-width:0;line-height:1.35}
.pm .n{display:flex;align-items:center;gap:6px;font-size:var(--fs-name);font-weight:700;min-width:0}
.pm .n>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm .bot{font-size:10.5px;font-weight:750;color:var(--t2);background:var(--inset-2);padding:1px 6px;border-radius:5px;flex:none}
.gbadge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:6px;font-size:10.5px;font-weight:750;color:rgb(var(--game-rgb));background:rgba(var(--game-rgb),.13);flex:none}
.gbadge svg{width:12px;height:12px}
.pm .s{display:flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--t3);margin-top:2px;min-width:0;white-space:nowrap}
.pm .s .h{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pm .s .sep{color:var(--t4)}
.pm .s .c{display:inline-flex;align-items:center;gap:5px;color:var(--t2);font-weight:600}
.more{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--t3);margin-right:-8px}
.more:hover{background:var(--hover);color:var(--t1)}
.pb{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.tx{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--t1);word-break:break-word;white-space:pre-wrap;letter-spacing:.005em}
.tx .ht{color:var(--brand-tx);font-weight:600;white-space:nowrap}
/* 名前のチップ：ゲームの「もの」（ポケモン・キャラ）の色を薄く敷く */
.ent{display:inline-flex;align-items:center;gap:5px;padding:0 7px 0 4px;margin:0 1px;border-radius:7px;line-height:1.55;font-weight:600;color:var(--t1);background:rgba(var(--c1),var(--chip-a));white-space:nowrap;transition:background .15s}
.ent:hover{background:rgba(var(--c1),var(--chip-a2))}
.ent .dm{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);flex:none;background:linear-gradient(135deg,rgb(var(--c1)) 50%,rgb(var(--c2)) 50%);margin:0 2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--inset-2);font-size:12.5px;font-weight:650;color:var(--t2)}
.tag:hover{color:var(--t1)}
.acts{display:flex;align-items:center;justify-content:space-between;margin:10px -10px 0;max-width:470px}
.act{display:inline-flex;align-items:center;gap:6px;min-width:44px;height:40px;padding:0 10px;border-radius:12px;color:var(--t3);font-size:13px;font-weight:600;transition:background .15s,color .15s}
.act:hover{background:var(--hover);color:var(--t1)}
.act svg.i{width:19px;height:19px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.act.like[aria-pressed=true]{color:var(--like)}.act.like[aria-pressed=true] svg{fill:currentColor}
.act.like.pop svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.3)}}
.act.bm[aria-pressed=true]{color:var(--t1)}.act.bm[aria-pressed=true] svg{fill:currentColor}

/* =====================================================================
   部品（モジュール）：中身はゲームのデータ、形は共通
   ===================================================================== */
.mod{background:var(--inset);border-radius:var(--r-mod);padding:14px 16px 16px}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:var(--fs-label);color:var(--t3);font-weight:700;letter-spacing:.04em}
.mh b{color:var(--t1);font-size:var(--fs-mod);font-weight:750;letter-spacing:0}
.mh .r{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:600;letter-spacing:0}
.mf{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.mf .lnk{margin-left:auto;color:var(--t2);font-weight:650;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;margin-right:-8px;border-radius:9px}
.mf .lnk:hover{background:var(--hover);color:var(--t1)}
/* 印（シジル）：ゲームごとの形を、共通の大きさ・余白で並べる */
.sig{display:grid;place-items:center;flex:none;border-radius:30%;background:rgba(var(--c1),.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .2s}
.sig svg{width:76%;height:76%}
.sig.xs{width:22px;height:22px;border-radius:7px}.sig.s{width:30px;height:30px;border-radius:9px}.sig.m{width:44px;height:44px;border-radius:13px}.sig.l{width:56px;height:56px;border-radius:16px}
.sig.down{opacity:.5;filter:grayscale(.75)}
a:hover>.sig{transform:translateY(-2px)}

/* ① 編成（パーティ・チーム） */
.roster{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.mem{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:8px 2px 6px;border-radius:12px;transition:background .15s}
.mem:hover{background:var(--hover)}
.mem .nm{font-size:12px;color:var(--t1);font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .sub{display:flex;gap:3px;margin-top:-3px}
.mem .sub i{width:14px;height:4px;border-radius:2px}
.mem .bst{font-size:10.5px;color:var(--t3);margin-top:-2px}
/* ② 重なり（ヒートの帯） */
.heat{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px}
.hc{aspect-ratio:1/1.6;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:2px;background:var(--inset-2);font-size:11px;font-weight:700;color:var(--t3);position:relative}
.hc b{font-size:11px;font-weight:800;line-height:1;min-height:11px}
.hc.w1{background:rgba(var(--warm),.18);color:var(--t1)}.hc.w2{background:rgba(var(--warm),.38);color:var(--t1)}.hc.w3{background:rgba(var(--warm),.62);color:#fff}
.app[data-theme=light] .hc.w3{color:#fff}
.hc .rs{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.hc .rs i{width:3px;height:3px;border-radius:50%;background:var(--pos)}
.legend{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* ③ 目盛り（素早さ・フレームなど） */
.lad{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.lad .who2{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:650;white-space:nowrap}
.lad .trk{position:relative;height:22px;display:flex;align-items:center}
.lad .trk::before{content:'';position:absolute;left:0;right:0;height:2px;border-radius:1px;background:var(--inset-2)}
.lad .bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(var(--c1),.25),rgb(var(--c1)));transform-origin:left}
.lad .val{position:relative;margin-left:8px;font-size:12.5px;font-weight:800}
.lad .tie{margin-left:6px;font-size:10.5px;font-weight:700;color:var(--t3)}
.lad-ticks{grid-column:2;display:flex;justify-content:space-between;font-size:10.5px;color:var(--t4);margin-top:-2px}
.grow .lad .bar{animation:growX .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*40ms)}
/* ④ 計算の結果 */
.vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.who small{display:block;font-size:11.5px;color:var(--t3);white-space:nowrap}
.arrow{color:var(--t4);flex:none}
.act-chip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:10px;background:var(--inset-2);font-size:13px;font-weight:700;white-space:nowrap}
.res{display:flex;align-items:flex-end;gap:16px;margin-top:18px;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1}
.big small{font-size:15px;font-weight:700;color:var(--t2);margin:0 2px}
.verdict{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:750;background:var(--inset-2)}
.verdict em{font-style:normal;color:var(--t3);font-weight:650;margin-left:6px}
.dist{display:flex;align-items:flex-end;gap:3px;height:34px;margin-left:auto}
.dist i{width:6px;border-radius:2px;background:rgba(var(--c1),.55);transform-origin:bottom}
.dist i.ko{background:rgb(var(--c1))}
.hp{position:relative;height:8px;border-radius:4px;background:rgba(127,135,160,.18);margin-top:14px;overflow:hidden}
.hp .rest{position:absolute;inset:0 auto 0 0;background:var(--pos);opacity:.6;border-radius:4px;transform-origin:left}
.hp .rng{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(var(--c1),.9) 0 4px,rgba(var(--c1),.55) 4px 8px)}
.cond{font-size:12px;color:var(--t3);margin-top:10px;line-height:1.6}
.grow .dist i{animation:growY .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*25ms)}
.grow .hp .rest{animation:growX .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(.1)}}@keyframes growX{from{transform:scaleX(0)}}
/* ⑤ 対戦の記録 */
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.outcome{display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:76px;border-radius:20px;background:var(--pos-soft);color:var(--pos)}
.outcome b{font-size:17px;font-weight:850;letter-spacing:.08em;line-height:1.1}
.outcome small{font-size:11px;font-weight:700;opacity:.85;margin-top:3px}
.outcome.l{background:var(--neg-soft);color:var(--neg)}
.teams{display:flex;flex-direction:column;gap:8px;min-width:0}
.tr{display:flex;align-items:center;gap:10px;min-width:0}
.tr .lb{width:3.2em;flex:none;font-size:11.5px;color:var(--t3);font-weight:650}
.tr .row{display:flex;gap:4px}
.tr .left{font-size:11.5px;color:var(--t3);margin-left:4px}
.rate{text-align:right;line-height:1.3}
.rate b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em}
.rate .d{font-size:13px;font-weight:750;color:var(--pos)}
.rate small{display:block;font-size:11px;color:var(--t3);margin-top:3px}
.selfrep{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:700;color:var(--t3);box-shadow:inset 0 0 0 1px var(--t4)}
/* ⑥ リンク */
.link{display:flex;align-items:center;gap:14px;padding:14px 16px}
.link .lg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--inset-2);color:var(--t2);flex:none}
.link b{display:block;font-size:14px;line-height:1.4}.link small{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.link:hover{background:var(--inset-2)}

/* 右の列 */
.search{display:flex;align-items:center;gap:12px;height:48px;padding:0 18px;border-radius:16px;background:var(--inset);color:var(--t3);font-size:14.5px;box-shadow:var(--hl)}
.pnl{padding:18px 8px 10px}
.pnl h2{font-size:15px;font-weight:750;margin:0 12px 10px;display:flex;align-items:center}
.pnl h2 small{margin-left:auto;font-size:12px;color:var(--t3);font-weight:550}
.ql{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px}
.ql:hover{background:var(--hover)}
.ql .q{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--inset-2);color:var(--t2);flex:none}
.ql b{display:block;font-size:14px;font-weight:650}.ql small{display:block;font-size:12px;color:var(--t3)}
.foot{font-size:11.5px;color:var(--t4);padding:0 12px;line-height:1.7}
.bgp{padding:2px 12px 8px}
.pre{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pre button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--t3);min-width:0}
.pre button[aria-checked=true]{color:var(--t1)}
.sw{width:100%;aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,135,160,.18)}
.pre button[aria-checked=true] .sw{box-shadow:0 0 0 2px var(--card-solid),0 0 0 4px var(--brand)}
.sw.add{display:grid;place-items:center;color:var(--t3);background:var(--inset)}
.rng-row{margin-top:16px}
.rng-row label{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:6px}
.rng-row output{color:var(--t3);font-weight:550}
input[type=range]{width:100%;accent-color:var(--brand);margin:0;height:28px}
.readable{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--t3)}
.readable i{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}

/* =====================================================================
   スマホ
   ===================================================================== */
.m-top,.m-cats{display:none}
.app.m .m-top{display:block;position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 4px) 10px 6px}
.mt-row{display:flex;align-items:center;gap:6px;height:48px}
.mt-row .seg{flex:1;max-width:236px;margin:0 auto;display:flex}
.mt-row .seg button{flex:1;height:36px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--t2)}
.ib:hover,.ib:active{background:var(--hover);color:var(--t1)}
.app.m .fh,.app.m .cmp{display:none}
.app.m .m-cats{display:block;margin:4px -12px 12px}
.app.m .cats{padding:2px 12px 4px}
.app.m .cat{height:36px}
.app.m .feed{padding:6px 12px calc(var(--sab) + 120px)}
.app.m .post{padding:16px 16px 6px}
.app.m .pb{margin-top:12px;gap:12px}
.app.m .acts{margin:6px -8px 0;max-width:none}
.app.m .act{height:44px;padding:0 8px}
.app.m .mod{padding:12px 12px 14px}
.app.m .roster{gap:4px}
.app.m .mem{padding:4px 0}
.app.m .mem .nm,.app.m .mem .bst{display:none}
.app.m .roster .sig.m{width:100%;max-width:46px;height:auto;aspect-ratio:1}
.app.m .heat{grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.app.m .hc{aspect-ratio:auto;height:46px}
.app.m .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.app.m .who{flex-direction:column;align-items:flex-start;gap:6px}
.app.m .arrow{align-self:center}
.app.m .act-chip{grid-column:1/-1;margin:6px 0 0;justify-self:start}
.app.m .big{font-size:26px}
.app.m .dist{margin-left:0;width:100%;justify-content:space-between}
.app.m .dist i{width:auto;flex:1}
.app.m .rec{grid-template-columns:auto 1fr;gap:12px 14px}
.app.m .rate{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;text-align:left;padding-top:10px;box-shadow:inset 0 1px 0 rgba(127,135,160,.12)}
.app.m .rate b{font-size:17px}.app.m .rate small{margin:0 0 0 auto}
.app.m .outcome{width:64px;height:64px}
.app.m .tag{height:28px;padding:0 11px;font-size:12px}
.app.m .lad .who2 span:last-child{display:none}.app.m .lad{gap:6px 10px}
.nav,.fab{display:none}
.app.m .nav{display:flex;position:absolute;z-index:30;left:12px;right:12px;bottom:calc(var(--sab) + 8px);height:64px;padding:6px;border-radius:24px;box-shadow:var(--hl),var(--sh-2)}
.app.m[data-theme=dark] .nav{background:rgba(37,41,55,.92);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.app.m[data-theme=light] .nav{background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-size:10.5px;font-weight:600;color:var(--t3);position:relative}
.nav a svg.i{width:23px;height:23px}
.nav a[aria-current=page]{color:var(--t1);background:var(--inset-2)}
.nav a[aria-current=page] svg{color:var(--brand-tx)}
.nav a .bd{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.app.m .fab{display:grid;place-items:center;position:absolute;z-index:31;right:18px;bottom:calc(var(--sab) + 86px);width:60px;height:60px;color:#fff;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg.hx{position:absolute;inset:0;width:60px;height:60px;filter:drop-shadow(0 10px 16px rgba(var(--brand-rgb),.45)) drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.fab svg.i{position:relative;width:24px;height:24px}
.scrim{position:absolute;inset:0;z-index:50;background:rgba(5,6,10,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--raised);border-radius:28px 28px 0 0;box-shadow:var(--hl),var(--sh-2);padding:10px 18px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--t4);opacity:.6;margin:0 auto 14px}
.sheet h2{font-size:17px;font-weight:750;margin:0 0 14px;display:flex;align-items:center}
.sheet h2 .ib{margin-left:auto;margin-right:-10px}
.sheet textarea{width:100%;min-height:120px;border:0;outline:0;resize:none;background:var(--inset);border-radius:16px;padding:14px;font-size:16px;line-height:1.55;color:var(--t1)}
.app:not(.m) .scrim,.app:not(.m) .sheet{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

<div class="pv" role="toolbar" aria-label="見本の操作（本番には出ません）">

  <span class="lbl">ゲームの例</span>
  <div class="g" id="pv-g" role="group" aria-label="ゲームの例"></div>
  <span class="sp"></span>

</div>

 <div class="app" id="app" data-theme="dark">
  <div class="bg atmos" id="bg"></div><div class="bg-img" id="bgimg"></div><div class="grain" aria-hidden="true"></div>
  <div class="scroll" id="scroll"><div class="d-grid">
    <nav class="rail" aria-label="メニュー" id="rail"></nav>

 </div>

/* =====================================================================
   A. ゲームのパック（ゲームごとに違うもの：データ・色・印の形・言葉・部品の中身）

   ===================================================================== */
const TYPES=[['normal','ノ','ノーマル','#9A9A8E'],['fire','炎','ほのお','#E57A3A'],['water','水','みず','#4C8FE6'],['electric','電','でんき','#E7C23C'],['grass','草','くさ','#5DB65A'],['ice','氷','こおり','#6CC7D0'],['fighting','闘','かくとう','#C9524A'],['poison','毒','どく','#A15CB8'],['ground','地','じめん','#C49A4E'],['flying','飛','ひこう','#8C95E8'],['psychic','超','エスパー','#E86A8E'],['bug','虫','むし','#98B03A'],['rock','岩','いわ','#B4A46A'],['ghost','霊','ゴースト','#7A62A8'],['dragon','竜','ドラゴン','#7366E8'],['dark','悪','あく','#6E625C'],['steel','鋼','はがね','#8495A8'],['fairy','妖','フェアリー','#D97FAF']];
const TC={};TYPES.forEach(t=>TC[t[0]]=t);
/* タイプ相性（公開されているゲームの決まり＝事実。1倍以外だけ書く） */
const CHART={normal:{rock:.5,ghost:0,steel:.5},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},
 electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},
 ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},
 poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},
 flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5,steel:.5},psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},
 bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},
 ghost:{normal:0,psychic:2,ghost:2,dark:.5},dragon:{dragon:2,steel:.5,fairy:0},dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},
 steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5}};
const eff=(atk,defs)=>defs.reduce((m,d)=>m*((CHART[atk]||{})[d]??1),1);

/* 印の形1：ポケモン＝6つの能力（種族値）の六角形。1つ目のタイプと2つ目のタイプで斜めに塗り分ける（当サイトの「種族値の形」を磨いたもの） */
function hexSigil(e){const R=40,P=f=>e.stats.map((v,i)=>{const r=R*f(v),t=-Math.PI/2+i*Math.PI/3;return (r*Math.cos(t)).toFixed(1)+','+(r*Math.sin(t)).toFixed(1)}).join(' ');
  return `<svg viewBox="-48 -48 96 96" aria-hidden="true"><polygon points="${P(()=>1)}" fill="none" stroke="rgb(${e.c1})" stroke-opacity=".3" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="${P(()=>.5)}" fill="none" stroke="rgb(${e.c1})" stroke-opacity=".14" stroke-width="1.6"/>
  <polygon points="${P(v=>Math.max(.15,Math.min(1,v/150)))}" fill="url(#g-${e.key})" stroke-linejoin="round" stroke="rgb(${e.c2})" stroke-width="3.2"/></svg>`}
/* 印の形2（架空のゲーム）：4つの能力のひし形＋芯の棒 */
function diaSigil(e){const R=40,ax=[[0,-1],[1,0],[0,1],[-1,0]],P=f=>e.stats.map((v,i)=>((R*f(v))*ax[i][0]).toFixed(1)+','+((R*f(v))*ax[i][1]).toFixed(1)).join(' ');
  return `<svg viewBox="-48 -48 96 96" aria-hidden="true"><polygon points="${P(()=>1)}" fill="none" stroke="rgb(${e.c1})" stroke-opacity=".32" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="-40" y1="0" x2="40" y2="0" stroke="rgb(${e.c1})" stroke-opacity=".18" stroke-width="1.6"/><line x1="0" y1="-40" x2="0" y2="40" stroke="rgb(${e.c1})" stroke-opacity=".18" stroke-width="1.6"/>
  <polygon points="${P(v=>Math.max(.18,Math.min(1,v/10)))}" fill="url(#g-${e.key})" stroke="rgb(${e.c2})" stroke-width="3.2" stroke-linejoin="round"/></svg>`}

const PACKS={
 pokechamp:{id:'pokechamp',name:'ポケモンチャンピオンズ',short:'ポケチャン',color:'#E8B931',
  /* 当サイトのゲームの印（独自）：円の中の六角形。公式のロゴではない */

  words:{entity:'ポケモン',roster:'パーティ',size:6,ladder:'素早さ種族値',stat:'合計種族値'},

   ashi:['アシレーヌ','Primarina',['water','fairy'],[80,74,74,60,116,126]],armor:['アーマーガア','Corviknight',['flying','steel'],[98,87,105,67,85,53]],
   wind:['ウインディ','Arcanine',['fire'],[90,110,80,95,80,100]],kai:['カイリュー','Dragonite',['dragon','flying'],[91,134,95,80,100,100]],
   dpt:['ドラパルト','Dragapult',['dragon','ghost'],[88,120,75,142,75,100]],mimi:['ミミッキュ','Mimikyu',['ghost','fairy'],[55,90,80,96,105,50]]},
  ent(k){const r=this.raw[k];if(!r)return null;const [n,en,t,st]=r;return {key:'pc-'+k,id:k,n,en,stats:st,total:st.reduce((a,b)=>a+b,0),speed:st[3],
   c1:rgb(TC[t[0]][3]),c2:rgb(TC[t[1]||t[0]][3]),marks:t.map(x=>TC[x][3]),sub:t.map(x=>TC[x][2]).join('・'),types:t}},
  /* ゲームだけにある「重なり」の計算：タイプごとに、弱い（2倍以上）匹と、受けられる（半分以下）匹を数える */
  overlap(ids){return TYPES.map(([k,ab,name,col])=>{let w=0,r=0;ids.forEach(id=>{const e=eff(k,this.ent(id).types);if(e>1)w++;else if(e<1)r++});return {k,ab,name,col,w,r}})}},
 arena:{id:'arena',name:'ARENA LINE（架空）',short:'ARENA',color:'#3FB6C9',
  glyph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21 12 12 21 3 12z"/><path d="M12 8v8M8 12h8"/></svg>',
  words:{entity:'キャラクター',roster:'チーム',size:3,ladder:'発生フレーム（小さいほど速い）',stat:'総合'},
  sigil:diaSigil,
  cls:{rush:['突進','#E0664F'],zone:['遠距離','#4F9BE0'],grap:['投げ','#B07A3F'],trap:['設置','#8D6BD8']},
  raw:{soma:['ソウマ','Soma',['rush','grap'],[9,7,3,5]],nem:['ネム','Nem',['zone','trap'],[5,6,9,4]],gald:['ガルド','Gald',['grap','rush'],[8,3,2,9]],
   iv:['イヴ','Iv',['trap','zone'],[6,5,7,5]],towa:['トワ','Towa',['rush'],[7,9,4,4]],balk:['バルク','Balk',['grap'],[9,2,2,10]]},
  frames:{soma:6,nem:11,gald:8,iv:9,towa:5,balk:10},
  ent(k){const r=this.raw[k];if(!r)return null;const [n,en,c,st]=r;return {key:'ar-'+k,id:k,n,en,stats:st,total:st.reduce((a,b)=>a+b,0),speed:this.frames[k],
   c1:rgb(this.cls[c[0]][1]),c2:rgb(this.cls[c[1]||c[0]][1]),marks:c.map(x=>this.cls[x][1]),sub:c.map(x=>this.cls[x][0]).join('・'),types:c}}}
};
const P=g=>PACKS[g];

/* =====================================================================
   B. Game Kid/s の共通の部品（どのゲームでも同じ形。中身はパックから）
   ===================================================================== */
/* 印のグラデーション（2つの色で斜めに塗り分け）。印は全部この1つの定義を使う */
function defsHTML(){let d='';for(const g of Object.values(PACKS))for(const k of Object.keys(g.raw)){const e=g.ent(k);
  d+=`<linearGradient id="g-${e.key}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(${e.c1})"/><stop offset=".52" stop-color="rgb(${e.c1})"/><stop offset=".52" stop-color="rgb(${e.c2})"/><stop offset="1" stop-color="rgb(${e.c2})"/></linearGradient>`}
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${d}</defs></svg>`}
const sig=(g,k,size,extra)=>{const e=P(g).ent(k);return `<span class="sig ${size}${extra?' '+extra:''}" style="--c1:${e.c1}" role="img" aria-label="${esc(e.n)}">${P(g).sigil(e)}</span>`};
const AV=(u,s)=>`<span class="av" style="width:${s}px;height:${s}px;background:${u.c};font-size:${Math.round(s*.4)}px" aria-hidden="true">${u.ch}</span>`;
const gbadge=g=>`<span class="gbadge" style="--game-rgb:${rgb(P(g).color)}">${P(g).glyph}${P(g).short}</span>`;

/* 名前のチップ（決定 D4 の決まり：kfold・3文字以上・除外リスト・日本語と英語で区切りを別に・#と@は見ない・同じものは1回） */
const SMALL={'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ヮ':'ワ','ヵ':'カ','ヶ':'ケ'};
const kfold=s=>[...s].map(ch=>{const c=ch.charCodeAt(0);const k=(c>=0x3041&&c<=0x3096)?String.fromCharCode(c+0x60):ch;return SMALL[k]||k}).join('');
const edge=ch=>!!ch&&/[゠-ヿA-Za-z0-9]/.test(ch);
function rich(g,raw){const pk=P(g),out=[],used=new Set();
  for(const part of raw.split(/([#＃][^\s#＃@＠]+|[@＠][A-Za-z0-9_]+)/)){
    if(!part)continue;
    if(/^[#＃@＠]/.test(part)){out.push(`<span class="ht">${esc(part)}</span>`);continue}
    const f=kfold(part),hits=[];
    for(const k of Object.keys(pk.raw)){const e=pk.ent(k),jn=kfold(e.n);let from=0,i;
      while((i=f.indexOf(jn,from))>=0){from=i+1;if(e.n.length<3&&g==='pokechamp')continue;if(edge(part[i-1])||edge(part[i+jn.length]))continue;hits.push({i,len:jn.length,k})}}
    hits.sort((a,b)=>a.i-b.i);let pos=0;
    for(const h of hits){if(h.i<pos||used.has(h.k))continue;used.add(h.k);const e=pk.ent(h.k);
      out.push(esc(part.slice(pos,h.i)));
      out.push(`<a href="#" class="ent" style="--c1:${e.c1};--c2:${e.c2}" data-toast="「${e.n}」のページへ（見本なので移動しません）" data-vis><i class="dm" aria-hidden="true"></i>${esc(part.slice(h.i,h.i+h.len))}</a>`);pos=h.i+h.len}
    out.push(esc(part.slice(pos)))}
  return out.join('')}

/* 部品1：編成 */
function mRoster(g,m){const pk=P(g);return `<div class="mod" role="group" aria-label="${pk.words.roster} ${esc(m.name)}">
  <div class="mh"><b class="pt">${esc(m.name)}</b><span>${m.fmt}・${m.ids.length}${pk.words.size===6?'匹':'人'}</span><span class="r">${S('eye',13)}${m.disc}</span></div>
  <div class="roster" style="--n:${m.ids.length}">${m.ids.map(k=>{const e=pk.ent(k);return `<a href="#" class="mem" aria-label="${e.n}（${e.sub}）" data-toast="「${e.n}」のページへ（見本）" data-vis>${sig(g,k,'m')}<span class="nm">${e.n}</span><span class="sub">${e.marks.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span class="bst num">${pk.words.stat} ${e.total}</span></a>`}).join('')}</div>
  ${m.date?`<div class="mf">${S('cal',13)}${m.date}に共有した時点の内容<a href="#" class="lnk" data-toast="空いている枠に写します（見本）" data-vis>この${pk.words.roster}を使う${S('chev',14)}</a></div>`:''}</div>`}
/* 部品2：重なり（ヒートの帯） */
function mOverlap(g,m){const cells=P(g).overlap(m.ids),top=cells.filter(c=>c.w>=2).sort((a,b)=>b.w-a.w);
  return `<div class="mod" role="group" aria-label="弱点の重なり">
  <div class="mh"><b>弱点の重なり</b><span class="r">タイプ相性だけ・特性は含まない</span></div>
  <div class="heat">${cells.map(c=>`<span class="hc${c.w?' w'+Math.min(3,c.w):''}" title="${c.name}：弱い ${c.w}・受けられる ${c.r}" aria-label="${c.name}タイプ：弱い${c.w}匹、受けられる${c.r}匹">${c.ab}<b class="num">${c.w||''}</b>${c.r?`<span class="rs">${'<i></i>'.repeat(Math.min(3,c.r))}</span>`:''}</span>`).join('')}</div>
  <div class="legend"><span><i style="background:rgba(var(--warm),.62)"></i>弱い匹の数</span><span><i style="background:var(--pos);width:6px;height:6px;border-radius:50%"></i>受けられる匹</span>${top.length?`<span style="margin-left:auto;color:var(--t2);font-weight:650">重なり：${top.map(c=>c.name+' '+c.w).join('、')}</span>`:''}</div></div>`}
/* 部品3：目盛り */
function mLadder(g,m){const pk=P(g),lo=m.min,hi=m.max,x=v=>Math.max(2,((v-lo)/(hi-lo))*100);
  const es=m.ids.map(k=>pk.ent(k)).sort((a,b)=>m.asc?a.speed-b.speed:b.speed-a.speed);
  return `<div class="mod grow" role="group" aria-label="${m.title||pk.words.ladder}">
  <div class="mh"><b>${m.title||pk.words.ladder}</b><span class="r">${m.note||''}</span></div>
  <div class="lad">${es.map((e,i)=>{const tie=es.some((o,j)=>j!==i&&Math.abs(o.speed-e.speed)<=1);return `<span class="who2">${sig(g,e.id,'s')}<span>${e.n}</span></span><span class="trk" style="--c1:${e.c1}"><span class="bar" style="width:${x(e.speed)}%;--k:${i}"></span><span class="val num">${e.speed}</span>${tie?'<span class="tie">ほぼ同じ</span>':''}</span>`}).join('')}
   ${m.ticks?`<span></span><span class="lad-ticks num">${m.ticks.map(t=>`<span>${t}</span>`).join('')}</span>`:''}</div></div>`}
/* 部品4：計算の結果（16段階の分布つき） */
function mCalc(g,m){const pk=P(g),A=pk.ent(m.a),D=pk.ent(m.d),rolls=[...Array(16)].map((_,i)=>m.min+(m.max-m.min)*i/15);
  return `<div class="mod grow" role="group" aria-label="${m.kind}の結果" style="--c1:${m.ac}">
  <div class="mh">${S('calc',14)}<span>${m.kind}</span><span class="r">${m.fmt}</span></div>
  <div class="vs"><div class="who">${sig(g,m.a,'s')}<span><b>${A.n}</b><small>${m.aCond}</small></span></div><span class="arrow">${S('arrow',18)}</span><div class="who">${sig(g,m.d,'s')}<span><b>${D.n}</b><small>${m.dCond}</small></span></div>
   <span class="act-chip"><span class="dot" style="background:rgb(${m.ac})"></span>${m.action}</span></div>
  <div class="res"><span class="big num">${m.min.toFixed(1)}<small>〜</small>${m.max.toFixed(1)}<small>%</small></span><span class="verdict">${m.verdict}<em class="num">${m.prob}</em></span>
   <span class="dist" aria-label="乱数16段階の分布（見本）">${rolls.map((r,i)=>`<i class="${r>=50?'ko':''}" style="height:${30+r/m.max*70}%;--k:${i}"></i>`).join('')}</span></div>
  <div class="hp" aria-hidden="true"><span class="rest" style="width:${100-m.max}%"></span><span class="rng" style="left:${100-m.max}%;width:${m.max-m.min}%"></span></div>
  <div class="cond">${m.note}</div></div>`}
/* 部品5：対戦の記録 */
function mRecord(g,m){const row=(lb,ids,down)=>`<div class="tr"><span class="lb">${lb}</span><span class="row">${ids.map(k=>sig(g,k,'s',down.includes(k)?'down':'')).join('')}</span><span class="left num">残り${ids.length-down.length}</span></div>`;
  return `<div class="mod" role="group" aria-label="対戦の記録">
  <div class="mh">${S('target',14)}<span>${m.fmt}</span><span class="r"><span class="selfrep">本人の記録</span></span></div>
  <div class="rec"><div class="outcome${m.win?'':' l'}"><b>${m.win?'WIN':'LOSE'}</b><small>${m.win?'勝ち':'負け'}</small></div>
   <div class="teams">${row('自分',m.mine,m.downMine)}${row('相手',m.opp,m.downOpp)}</div>
   ${m.rate?`<div class="rate"><b class="num">${m.rate.toLocaleString()}</b><span class="d num">${m.diff>0?'+':''}${m.diff}</span><small>レート・自己申告</small></div>`:'<div></div>'}</div></div>`}
function mLink(m){return `<a href="#" class="mod link" data-toast="公式サイトを開きます（見本）" data-vis><span class="lg">${S('link',20)}</span><span><b>${m.t}</b><small>${m.d}</small></span></a>`}
const MODS={roster:mRoster,overlap:mOverlap,ladder:mLadder,calc:mCalc,record:mRecord};

  for(let i=0;i<70;i++){const x=r()*900,y=r()*1400,rad=30+r()*110,h=[[255,170,90],[120,140,255],[255,110,150],[90,210,200]][Math.floor(r()*4)];

const NOTES=`<h2>設計メモ：フィード V3.1</h2><p>くわしくは <code>docs/social-redesign/v3.1/design-notes.md</code>。</p>
<h3>この版で変えたこと</h3><p>① 共通の部品とゲームのパックを分けた（上の「ゲームの例」で切りかえ）② 独自の印（シジル）：ゲームごとに形が違い、大きさ・余白は共通 ③ ゲームの情報そのものを見せる部品：弱点の重なり・目盛り（素早さ／フレーム）・乱数16段階の分布 ④ 質感（細かい粒）・日本語の字詰め・控えめな動き</p>
<h3>架空のゲーム</h3><p>「ARENA LINE（架空）」は、別のゲームを足しても画面を作り直さずに済むかを確かめるための作りものです。キャラクター・数値はすべて架空。</p>
<h3>画像について</h3><p>ゲームの公式の絵・アイコン・ロゴは使っていません。利用者が投稿するスクリーンショットは、ゲームごとのガイドラインに従う別の問題で、許可されているとは仮定していません（画像のボタンを押すと注意が出ます）。</p>
<h3>見本の数値</h3><p>ダメージ・確率・レートは見本。タイプ相性と種族値は実際のゲームの値（事実）。</p>
<h3>決めてほしいこと</h3><p>V3 の5つに加えて：印（シジル）を当サイトの正式な表し方にするか／ゲームの色（ポケチャン＝琥珀色）を使う場所／投稿の部品「弱点の重なり」「目盛り」を作るか。</p>`;

function render(keep){const sc=document.getElementById('scroll'),y=sc.scrollTop,app=document.getElementById('app'),st=document.getElementById('stage');
  app.dataset.theme=theme();app.classList.toggle('m',isM());
  st.classList.toggle('phone',isM()&&innerWidth>=480);st.classList.toggle('bare',isM()&&innerWidth<480);
  document.getElementById('rail').innerHTML=railHTML();document.getElementById('feed').innerHTML=feedHTML();document.getElementById('side').innerHTML=isM()?'':sideHTML();
  document.getElementById('nav').innerHTML=navHTML();
  const sh=document.getElementById('sheet');sh.innerHTML=sheetHTML();sh.classList.toggle('on',!!ST.sheet);document.getElementById('scrim').classList.toggle('on',!!ST.sheet);
  document.getElementById('pv-v').innerHTML=[['dd','PC・ダーク'],['dl','PC・ライト'],['md','スマホ・ダーク'],['ml','スマホ・ライト']].map(([k,t])=>`<button data-v="${k}" aria-pressed="${ST.v===k}">${t}</button>`).join('');
  document.getElementById('pv-g').innerHTML=[['pokechamp','ポケチャン'],['arena','架空のゲーム'],['mix','混在（将来）']].map(([k,t])=>`<button data-g="${k}" aria-pressed="${ST.g===k}">${t}</button>`).join('');
  document.body.classList.toggle('show-vis',ST.vis);document.getElementById('pv-vis').setAttribute('aria-pressed',ST.vis);
  const n=document.getElementById('notes');n.classList.toggle('on',ST.notes);n.innerHTML=NOTES;document.getElementById('pv-notes').setAttribute('aria-pressed',ST.notes);
  document.querySelectorAll('.mk').forEach(e=>e.style.setProperty('--logo',`url(${LOGO})`));
  applyBg();POSTS.forEach(p=>delete p.isNew);ST.enter=false;
  sc.scrollTop=keep?y:0;
  try{history.replaceState(null,'','?v='+ST.v+(ST.g!=='pokechamp'?'&g='+ST.g:'')+(ST.bg.p!=='atmos'?'&bg='+ST.bg.p:''))}catch(e){}}
let TT;function toast(t){const el=document.getElementById('toast');el.innerHTML=`<b>見本</b><span>${esc(t)}</span>`;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>el.classList.remove('on'),2400)}
function post(){const text=ST.draft.trim();if(!text)return;POSTS.unshift({id:Date.now(),g:curG(),u:'me',t:'たった今',cat:ST.dcat,text,f:1,isNew:1});ST.draft='';ST.dcat=null;ST.sheet=null;ST.menu=false;ST.cat='all';render();toast('この画面の中だけに追加しました。読み直すと消えます')}
function typed(w){const t=document.getElementById(w+'-t');ST.draft=t.value;const len=[...t.value].length,c=document.getElementById(w+'-c');c.hidden=!len;c.textContent=len+'/140';c.classList.toggle('over',len>140);document.getElementById(w+'-go').disabled=!(len&&len<=140)}

document.addEventListener('click',e=>{const T=s=>e.target.closest(s);let x;
  if((x=T('[data-v]'))){ST.v=x.dataset.v;ST.sheet=null;ST.menu=false;ST.enter=true;render();return}
  if((x=T('[data-g]'))){ST.g=x.dataset.g;ST.cat='all';ST.enter=true;render();return}
  if(T('#pv-vis')){ST.vis=!ST.vis;render(true);return}
  if(T('#pv-notes')){ST.notes=!ST.notes;render(true);return}
  if((x=T('[data-toast]'))){e.preventDefault();toast(x.dataset.toast);return}
  if((x=T('[data-tab]'))){ST.tab=x.dataset.tab;render(true);return}
  if((x=T('[data-cat]'))){ST.cat=x.dataset.cat;render(true);return}
  if((x=T('#d-cat,#m-cat'))){const w=x.id[0];ST.menu=ST.menu===w?false:w;render(true);document.querySelector('.menu.on button')?.focus();return}
  if((x=T('[data-dcat]'))){ST.dcat=x.dataset.dcat||null;const w=ST.menu;ST.menu=false;render(true);document.getElementById(w+'-cat')?.focus();return}
  if(ST.menu&&!T('.menu')){ST.menu=false;render(true)}
  if(T('#d-go')||T('#m-go')){post();return}
  if(T('#d-compose')){document.getElementById('d-t')?.focus();return}
  if(T('#fab')){ST.sheet='compose';render(true);setTimeout(()=>document.getElementById('m-t')?.focus(),300);return}
  if(T('#m-bg')){ST.sheet='bg';render(true);return}
  if(T('[data-close]')||T('#scrim')){ST.sheet=null;ST.menu=false;render(true);return}
  if((x=T('[data-like]'))){const p=POSTS.find(p=>p.id==x.dataset.like);p.liked=!p.liked;render(true);if(p.liked){const b=document.querySelector(`[data-like="${p.id}"]`);b&&b.classList.add('pop')}return}
  if((x=T('[data-bm]'))){const p=POSTS.find(p=>p.id==x.dataset.bm);p.bm=!p.bm;render(true);toast(p.bm?'ブックマークに追加しました':'ブックマークから外しました');return}
  if((x=T('[data-pre]'))){if(x.dataset.pre==='img'){if(!ST.bg.img){setImg(sample());return}ST.bg.p='img'}else ST.bg.p=x.dataset.pre;render(true);return}
  if(T('[data-sample]')){setImg(sample());return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='d-t')return typed('d');if(t.id==='m-t')return typed('m');
  if(t.id==='r-k'){ST.bg.k=+t.value;document.querySelectorAll('#o-k').forEach(o=>o.textContent=t.value+'%');applyBg()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-file]')&&t.files[0]){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setImg(c.toDataURL('image/jpeg',.85))};im.src=rd.result};rd.readAsDataURL(t.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ST.menu){const w=ST.menu;ST.menu=false;render(true);document.getElementById(w+'-cat')?.focus()}else if(ST.sheet){ST.sheet=null;render(true)}else if(ST.notes){ST.notes=false;render(true)}}});
addEventListener('resize',()=>render(true));
document.body.insertAdjacentHTML('afterbegin',defsHTML());
(()=>{const q=new URLSearchParams(location.search);const v=q.get('v');ST.v=['dd','dl','md','ml'].includes(v)?v:(innerWidth<700?'md':'dd');
  if(!v&&matchMedia('(prefers-color-scheme: light)').matches)ST.v=ST.v[0]+'l';
  if(['pokechamp','arena','mix'].includes(q.get('g')))ST.g=q.get('g');
  const b=q.get('bg');if(['atmos','mesh','slate','noise'].includes(b))ST.bg.p=b;
  if(q.get('still')==='1')ST.enter=false;
  render();if(b==='img')setImg(sample())})();
</script>
</body>
</html>
