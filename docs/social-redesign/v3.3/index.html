<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Kid/s フィード V3.3</title>
<!--
  Game Kid/s フィード V3.3（V3.2 に5つの細かい改善を入れた見本 2026-11-17）
  ・いまのサイトの使い方（左のメニュー・みんな／フォロー中・小さな投稿欄・スマホの下のタブ）をそのまま使い、
    V3.1 の独自の印（シジル）と対戦データの部品を「データのある投稿だけ」に入れた。
  ・ゲームの公式の絵・アイコン・ロゴは使わない。ロゴはサイト自身のもの（src/static/logo.png）だけを埋め込む。
  ・黄色い点線の部品（上の見本バー・設計メモ・「見本」の知らせ）は見本だけのもの。本番には出ない。
  ・このファイルだけで開ける。投稿・いいね・背景などはこの画面の中だけで動く（読み直すと元に戻る）。
-->
<style>
/* =====================================================================
   1. トークン：面は3段だけ（地・読む面・中の部品）。線ではなく明るさの差で分ける
   ===================================================================== */
.app{
  --canvas:#0E0F14;
  --sheet:rgba(20,22,29,.80);      /* 読む面（真ん中の列・右の列の箱） */
  --sheet-img:rgba(18,20,27,.90);  /* 背景に画像を使っているとき */
  --well:rgba(255,255,255,.045);   /* 投稿の中の部品 */
  --well-2:rgba(255,255,255,.075);
  --raised:#22252F; --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --sep:rgba(255,255,255,.06);     /* 投稿のあいだの区切り（細く・薄く・本文の列から） */
  --hl:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 18px 40px -16px rgba(0,0,0,.6);
  --t1:#ECEEF3; --t2:#B3B8C6; --t3:#9096A8; --t4:#5E6475;
  --brand:#7C6CF0; --brand-tx:#B1A6FF; --brand-rgb:124,108,240; --onbrand:#fff;
  --pos:#45C796; --neg:#EE6F79; --warm:240,140,90; --like:#F2668B;
  --chip:.13;
  --input:rgba(255,255,255,.055);  /* 投稿欄の入力面（V3.3：少し明るく） */
  --sig-plate:rgba(255,255,255,.07); --sig-ring:rgba(255,255,255,.08);  /* 記号の後ろの中立の板と内側の輪（V3.3） */
  color-scheme:dark;
}
.app[data-theme=light]{
  --canvas:#ECEEF3;
  --sheet:rgba(255,255,255,.82);
  --sheet-img:rgba(255,255,255,.92);
  --well:#F3F4F8; --well-2:#EAECF2;
  --raised:#FFFFFF; --hover:rgba(20,24,40,.04); --press:rgba(20,24,40,.07);
  --sep:rgba(20,24,40,.07);
  --hl:inset 0 1px 0 rgba(255,255,255,.8);
  --lift:0 16px 36px -14px rgba(22,26,44,.25);
  --t1:#151824; --t2:#454C5F; --t3:#5E6477; --t4:#9CA2B2;
  --brand:#5F52E0; --brand-tx:#4B3FCF; --brand-rgb:95,82,224;
  --pos:#12906A; --neg:#CF4450; --warm:226,104,52; --like:#D93A68;
  --chip:.11;
  --input:rgba(20,24,40,.035);
  --sig-plate:rgba(255,255,255,.55); --sig-ring:rgba(20,24,40,.06);
  color-scheme:light;
}
.app{--fs-body:14.5px;--lh-body:1.65;--fs-name:14.5px;--fs-meta:13px}
.app.m{--fs-body:15px;--lh-body:1.62}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0A0B0F;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;color:#e8e8ee}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app :focus-visible{outline:2px solid var(--brand-tx);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.pt{font-feature-settings:"palt"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== 見本のバー（本番には出ない） ===== */
.pv{position:fixed;inset:0 0 auto 0;height:48px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 12px;background:#17181E;border-bottom:2px dashed #F5D547;font-size:12.5px;color:#d9d9e2;overflow-x:auto;scrollbar-width:none}
.pv::-webkit-scrollbar{display:none}
.pv .tag{flex:none;background:#F5D547;color:#2a2300;font-weight:900;font-size:11px;padding:3px 8px;border-radius:5px}
.pv .g{display:flex;gap:2px;background:#25262E;border-radius:9px;padding:3px;flex:none}
.pv .g button{padding:5px 10px;border-radius:7px;color:#a9a9b6;white-space:nowrap}
.pv .g button[aria-pressed=true]{background:#43444F;color:#fff;font-weight:700}
.pv .sp{flex:1}
.pv .x{flex:none;padding:5px 10px;border-radius:8px;border:1.5px dashed #F5D547;color:#F5D547;font-weight:800;white-space:nowrap}
.pv .x[aria-pressed=true]{background:#F5D547;color:#2a2300}
.show-vis [data-vis]{outline:1.5px dashed #F5D547!important;outline-offset:2px}
.notes{position:fixed;top:48px;right:0;bottom:0;width:380px;max-width:100vw;z-index:99;background:#17181E;color:#dcdce4;border-left:2px dashed #F5D547;padding:16px 18px 40px;overflow:auto;font-size:13px;line-height:1.7;transform:translateX(104%);transition:transform .25s;visibility:hidden}
.notes.on{transform:none;visibility:visible}
.notes h2{font-size:14px;margin:0 0 6px;color:#fff}.notes h3{font-size:11px;letter-spacing:.08em;color:#8d8d99;margin:18px 0 6px}.notes p{margin:0 0 8px}
.notes code{background:#24252c;padding:1px 5px;border-radius:4px;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;transition:.22s;z-index:120;display:flex;gap:10px;align-items:center;background:#1E1F27;color:#fff;padding:10px 16px 10px 10px;border-radius:12px;font-size:13px;border-left:4px solid #F5D547;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;max-width:calc(100vw - 24px)}
.toast b{background:#F5D547;color:#2a2300;font-size:10.5px;padding:2px 6px;border-radius:4px;flex:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 舞台と背景 ===== */
.stage{position:fixed;inset:48px 0 0 0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.stage.phone{padding:28px 0 56px;background:radial-gradient(60% 50% at 50% 0,#1d1e28,#0A0B0F 70%)}
.app{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;color:var(--t1);background:var(--canvas)}
.stage.phone .app{width:390px;height:844px;flex:none;border-radius:48px;box-shadow:0 0 0 10px #050507,0 0 0 11px #2a2b33,0 40px 100px rgba(0,0,0,.6)}
.stage.bare{padding:0}.stage.bare .app{width:100%;height:100%;border-radius:0;box-shadow:none}
.app.m{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
.stage.phone .app.m{--sat:47px;--sab:34px}
.bg,.bg-img{position:absolute;inset:0;pointer-events:none}
.bg{z-index:-3}.bg-img{z-index:-2;background-size:cover;background-position:center;opacity:0;transition:opacity .25s}
/* いまのサイトの「光」（右上だけ）を残す */
.bg.atmos{background:radial-gradient(52vmax 38vmax at 100% 0%,rgba(var(--brand-rgb),.30),transparent 70%),var(--canvas)}
.app[data-theme=light] .bg.atmos{background:radial-gradient(52vmax 38vmax at 100% 0%,rgba(var(--brand-rgb),.17),transparent 70%),var(--canvas)}
.bg.mesh{background:radial-gradient(42% 38% at 10% 6%,rgba(var(--brand-rgb),.18),transparent 70%),radial-gradient(38% 34% at 94% 12%,rgba(64,150,210,.11),transparent 70%),radial-gradient(46% 40% at 72% 98%,rgba(190,96,160,.09),transparent 72%),var(--canvas)}
.app[data-theme=light] .bg.mesh{background:radial-gradient(42% 38% at 10% 6%,rgba(var(--brand-rgb),.12),transparent 70%),radial-gradient(38% 34% at 94% 12%,rgba(64,150,210,.09),transparent 70%),radial-gradient(46% 40% at 72% 98%,rgba(210,110,170,.07),transparent 72%),var(--canvas)}
.bg.slate{background:var(--canvas)}
.bg.noise{background:var(--noise),var(--canvas);background-size:180px 180px,auto}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;overscroll-behavior:contain}

/* =====================================================================
   2. PC：いまのサイトと同じ3列（左のメニュー／真ん中の読む面／右の列）
   ===================================================================== */
.d-grid{display:grid;grid-template-columns:248px minmax(0,600px) 320px;gap:28px;justify-content:center;padding:0 24px;min-height:100%}
.app.m .d-grid{display:block;padding:0}
@media (max-width:1240px){.app:not(.m) .d-grid{grid-template-columns:72px minmax(0,600px);gap:20px}.app:not(.m) .side{display:none}
  .app:not(.m) .rail .lb,.app:not(.m) .rail .wm,.app:not(.m) .rail .me-t{display:none}.app:not(.m) .rail .ni,.app:not(.m) .rail .qa{justify-content:center;padding:0}}
.rail{position:sticky;top:0;height:min(calc(100vh - 48px),760px);padding:18px 0 20px;display:flex;flex-direction:column;gap:4px}
.app.m .rail{display:none}
/* 背景に画像を使うときは、左のメニューの文字の後ろにも面を敷く */
.app.bgimg .rail{margin:10px 0;height:min(calc(100vh - 68px),760px);padding:12px 8px;border-radius:22px;background:var(--sheet-img)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 14px 10px}
.mk{width:28px;height:28px;background:var(--t1);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.wm{font-weight:800;font-size:17.5px;letter-spacing:-.01em}.wm span{color:var(--t3);font-weight:600}
.ni{display:flex;align-items:center;gap:16px;height:50px;padding:0 14px;border-radius:16px;font-size:16.5px;color:var(--t2);transition:background .15s,color .15s}
.ni svg.i{width:25px;height:25px}
.ni:hover{background:var(--hover);color:var(--t1)}
.ni[aria-current=page]{color:var(--t1);font-weight:800}
.ni[aria-current=page] svg{color:var(--brand-tx);stroke-width:2.1}
.ni .ct{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--onbrand);background:var(--brand);min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
/* いまのサイトと同じ：左の大きなボタンは「よく使う機能」（はじめは 相性を調べる） */
.qa{margin-top:18px;height:50px;border-radius:25px;background:var(--brand);color:var(--onbrand);font-weight:750;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px;transition:filter .15s,transform .15s}
.qa:hover{filter:brightness(1.07)}.qa:active{transform:scale(.98)}
.me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:10px;border-radius:16px;background:var(--hover)}
.me:hover{background:var(--hover)}
.me b{display:block;font-size:14.5px}.me small{display:block;color:var(--t3);font-size:12.5px}

/* 真ん中：1枚の読む面（投稿ごとの箱はつくらない） */
.feed{min-width:0;background:var(--sheet);min-height:100%;padding-bottom:60px}
.app.bgimg .feed{background:var(--sheet-img)}
.app:not(.m) .feed{border-radius:0}
.side{position:sticky;top:0;height:calc(100vh - 48px);overflow:auto;padding:14px 0 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}

/* 上：みんな／フォロー中（いまのサイトと同じ2等分）＋カテゴリ */
.fh{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--canvas) 76%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.app[data-theme=light] .fh{background:color-mix(in srgb,#F6F7FA 82%,transparent)}
.mt-row{display:none}
.tabs{display:flex;position:relative;height:50px}
.tabs button{flex:1;position:relative;font-size:14.5px;font-weight:650;color:var(--t3);transition:color .15s,background .15s}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected=true]{color:var(--t1);font-weight:800}
.tabs button[aria-selected=true]::after{content:'';position:absolute;left:50%;bottom:0;width:44px;height:3px;border-radius:3px;background:var(--brand);transform:translateX(-50%)}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 12px 10px}
.cats::-webkit-scrollbar{display:none}
/* V3.3：横に続きがあるときだけ、その端を少しうすくする（ずっと出る飾りにはしない） */
.cats{scroll-padding-inline:24px;-webkit-mask-image:linear-gradient(90deg,var(--fl,#000) 0,#000 var(--fw-l,0px),#000 calc(100% - var(--fw-r,0px)),var(--fr,#000) 100%);mask-image:linear-gradient(90deg,var(--fl,#000) 0,#000 var(--fw-l,0px),#000 calc(100% - var(--fw-r,0px)),var(--fr,#000) 100%)}
.cats[data-fade~=r]{--fr:transparent;--fw-r:36px}.cats[data-fade~=l]{--fl:transparent;--fw-l:24px}
.app.m .cats::after{content:'';flex:none;width:12px}
.cat{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:650;color:var(--t3);transition:background .15s,color .15s}
.cat:hover{background:var(--hover);color:var(--t1)}
.cat[aria-pressed=true]{background:var(--well-2);color:var(--t1)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

/* 投稿欄（いまのサイトと同じく小さい。押すと道具が出る） */
.cmp{display:flex;gap:12px;padding:14px 18px 12px;box-shadow:inset 0 -1px 0 var(--sep)}
.cmp .b{flex:1;min-width:0}
.cmp textarea{width:100%;border:0;outline:0;resize:none;background:var(--input);border-radius:12px;font-size:16px;line-height:1.5;padding:9px 12px;min-height:42px;max-height:180px;color:var(--t1);transition:background .15s}
.cmp textarea:focus{background:color-mix(in srgb,var(--input) 100%,rgba(var(--brand-rgb),.06))}
.cmp textarea::placeholder,.sheet textarea::placeholder{color:var(--t4)}
.tb{display:flex;align-items:center;gap:2px;margin-top:4px}
.cmp:not(.open) .tb .ext{display:none}
.tb .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--brand-tx);transition:background .15s}
.tb .ic:hover{background:var(--hover)}
.catpick{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;margin-left:4px;border-radius:10px;font-size:12.5px;font-weight:650;color:var(--t2);background:var(--well)}
.tb .sp{flex:1}
.cnt{font-size:12px;color:var(--t3);margin-right:10px}
.cnt.over{color:var(--neg);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 18px;border-radius:18px;font-size:14px;font-weight:750;transition:filter .15s,opacity .15s}
.btn-p{background:var(--brand);color:var(--onbrand)}
.btn-p:hover{filter:brightness(1.07)}.btn-p:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-q{background:var(--well-2);color:var(--t1);height:34px;font-size:13px;padding:0 14px;border-radius:12px}
.menu{position:absolute;z-index:40;min-width:230px;padding:6px;border-radius:16px;background:var(--raised);box-shadow:var(--hl),var(--lift);display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;text-align:left;font-size:14px;font-weight:600}
.menu button:hover{background:var(--hover)}
.menu small{margin-left:auto;color:var(--t3);font-weight:500;font-size:12px}
.menu .ck{margin-left:auto;color:var(--brand-tx)}

/* =====================================================================
   3. 投稿：ふつうの投稿は箱なし（本文とアイコンだけ）。区切りは本文の列から細く
   ===================================================================== */
.post{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:12px;padding:14px 18px 6px;position:relative}
.post::after{content:'';position:absolute;left:72px;right:18px;bottom:0;height:1px;background:var(--sep)}
.post:last-child::after{display:none}
.post.new{animation:nw 1.2s ease}
@keyframes nw{from{background:rgba(var(--brand-rgb),.10)}to{background:transparent}}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:750;color:#fff;font-size:16px}
.ph{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:var(--fs-meta);line-height:1.4}
.ph b{font-size:var(--fs-name);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.ph .bot{font-size:10.5px;font-weight:750;color:var(--t2);background:var(--well-2);padding:0 5px;border-radius:5px;align-self:center}
.ph .m2{color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .c{display:inline-flex;align-items:center;gap:5px;color:var(--t2);font-weight:600;white-space:nowrap}
.ph .more{margin-left:auto;align-self:center;width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--t3)}
.ph .more:hover{background:var(--hover);color:var(--t1)}
.tx{font-size:var(--fs-body);line-height:var(--lh-body);margin-top:2px;word-break:break-word;white-space:pre-wrap}
.tx .ht{color:var(--brand-tx);white-space:nowrap}
/* ポケモンの名前：色を薄く敷いた小さなチップ（下線のリンクにしない） */
.ent{display:inline-flex;align-items:center;gap:5px;padding:0 6px 0 5px;margin:0 1px;border-radius:6px;font-weight:650;background:rgba(var(--c1),var(--chip));white-space:nowrap}
.ent:hover{background:rgba(var(--c1),calc(var(--chip) + .08))}
.ent .dm{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,rgb(var(--c1)) 50%,rgb(var(--c2)) 50%);flex:none}
.acts{display:flex;justify-content:space-between;max-width:430px;margin:4px 0 0 -9px}
.act{display:inline-flex;align-items:center;gap:5px;min-width:44px;height:38px;padding:0 9px;border-radius:19px;color:var(--t3);font-size:13px;transition:color .15s,background .15s}
.act svg.i{width:18px;height:18px}
.act:hover{color:var(--brand-tx);background:rgba(var(--brand-rgb),.09)}
.act.like:hover{color:var(--like);background:rgba(242,102,139,.1)}
.act.like[aria-pressed=true]{color:var(--like)}.act.like[aria-pressed=true] svg{fill:currentColor}
.act.bm[aria-pressed=true]{color:var(--brand-tx)}.act.bm[aria-pressed=true] svg{fill:currentColor}
.link{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--well)}
.link b{font-size:13.5px;color:var(--brand-tx)}.link small{font-size:12px;color:var(--t3)}
.link:hover{background:var(--well-2)}

/* =====================================================================
   4. データの部品（データのある投稿だけ）。投稿の中の1段沈んだ面
   ===================================================================== */
.mod{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--well)}
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:2px;font-size:12px;color:var(--t3);margin-bottom:10px}
.mh b{font-size:13.5px;font-weight:750;color:var(--t1)}
.mh svg.i{width:15px;height:15px}
.mh .r{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
/* 分析の部品は小さな「分析」の見出しで区別する（色や枠は増やさない） */
.mh .kick{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--t3);padding:1px 6px;border-radius:5px;background:var(--well-2)}
.mf .sepd{color:var(--t4)}
.cv-sum{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:12.5px;color:var(--t2)}
/* V3.3：弱点の重なりの要点（注意の1行＋上位のタイプ）と、開くと出る18タイプ */
.cv-warn{display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:13px;font-weight:650;color:var(--t1)}
.cv-warn svg{color:rgb(var(--warm));flex:none}.cv-warn.ok svg{color:var(--pos)}
.cv-top{display:flex;flex-wrap:wrap;gap:6px}
.cv-t{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:9px;font-size:12.5px;color:var(--t1)}
.cv-t b{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.12)}
.app[data-theme=light] .cv-t b{background:rgba(255,255,255,.7)}
.cv-t em{font-style:normal;font-weight:800;font-size:12px;color:var(--t2)}
.cv-t.w2{background:rgba(var(--warm),.24)}.cv-t.w3{background:rgba(var(--warm),.42)}.cv-t.w1{background:rgba(var(--warm),.12)}
.cv-more{align-self:center;font-size:12px;color:var(--t3);margin-left:2px}
.cv-tg{display:inline-flex;align-items:center;gap:4px;margin-top:10px;min-height:36px;padding:0 10px 0 8px;margin-left:-8px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--t2)}
.cv-tg:hover{background:var(--hover);color:var(--t1)}
.cv-tg svg{transition:transform .2s}.cv-tg[aria-expanded=true] svg{transform:rotate(180deg)}
.app.m .cv-tg{min-height:44px}
.cv-det{margin-top:6px}.cv-det[hidden]{display:none}
.cv-sum>span{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.cv-sum b{font-weight:700;color:var(--t1);margin-right:4px}
.cv-sum i{font-style:normal;display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;border-radius:6px;font-size:11.5px;font-weight:800;color:var(--t1)}
.cv-sum i.w{background:rgba(var(--warm),.32)}.cv-sum i.g{background:rgba(69,199,150,.16)}
.cv-sum .more2{font-size:11.5px;color:var(--t3);margin-left:2px}
.cv-sum i em{font-style:normal;font-weight:700;color:var(--t2);font-size:10.5px}
.gctx{display:inline-flex;align-items:center;gap:5px;margin:0 0 14px 14px;align-self:flex-start;height:22px;padding:0 8px 0 6px;border-radius:7px;font-size:11px;font-weight:750;color:rgb(var(--game-rgb));background:rgba(var(--game-rgb),.12)}
.gctx svg{width:13px;height:13px}
.app[data-theme=light] .gctx{color:color-mix(in srgb,rgb(var(--game-rgb)) 70%,#000)}
@media (max-width:1240px){.app:not(.m) .gctx{margin-left:0;align-self:center;padding:0 5px}}
.sig{display:grid;place-items:center;flex:none;background:linear-gradient(rgba(var(--c1),.12),rgba(var(--c1),.12)),var(--sig-plate);box-shadow:inset 0 0 0 1px var(--sig-ring);border-radius:10px}
.sig svg{width:78%;height:78%}
.sig.xs{width:20px;height:20px;border-radius:6px}.sig.s{width:24px;height:24px;border-radius:7px}.sig.m{width:32px;height:32px;border-radius:10px}.sig.l{width:40px;height:40px;border-radius:12px}
.sig.down{opacity:.45;filter:grayscale(.8)}
/* パーティ：PC は1列に6匹、スマホは3×2で名前つき */
.party{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mem{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:6px 2px;border-radius:10px}
.mem:hover{background:var(--hover)}
.mem .nm{font-size:11.5px;font-weight:650;color:var(--t2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.party{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.app.m .party{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
.app.m .party[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.app.m .mem{flex-direction:row;gap:7px;padding:4px}
.app.m .mem .sig.l{width:32px;height:32px;border-radius:10px}
.mf{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.mf .lk{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--t2);font-weight:650;padding:4px 6px;border-radius:8px}
.mf .lk:hover{background:var(--hover);color:var(--t1)}
/* 弱点の重なり：ふだんは1行のまとめ。押すと18タイプの帯 */
.ov{margin-top:10px;padding-top:10px;box-shadow:inset 0 1px 0 var(--sep)}
.ov-sum{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:12.5px;color:var(--t2);min-height:36px;border-radius:8px;white-space:nowrap}
.app.m .ov-sum .cnt2{display:none}
.app.m .ov-sum{min-height:44px}
.ov-sum b{color:var(--t1);font-weight:700}
.ov-sum .chev{margin-left:auto;color:var(--t3);transition:transform .2s}
.ov-sum[aria-expanded=true] .chev{transform:rotate(180deg)}
.ov-sum .wl{display:inline-flex;gap:3px}
.ov-sum .wl i{font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:rgba(var(--warm),.3);color:var(--t1)}
.heat{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px}
.heat[hidden]{display:none}
.hc{height:48px;border-radius:7px;display:grid;grid-template-rows:14px 1fr 6px;justify-items:center;align-items:center;padding:4px 0 4px;background:var(--well-2);font-size:11px;font-weight:700;color:var(--t3)}
.hc b{font-size:12.5px;font-weight:800;color:var(--t1);line-height:1}.hc b.z{color:var(--t4);font-weight:600}
.hc.w1{background:rgba(var(--warm),.15)}.hc.w2{background:rgba(var(--warm),.32)}.hc.w3{background:rgba(var(--warm),.55)}
.hc.w1 .ab,.hc.w2 .ab,.hc.w3 .ab{color:var(--t1)}
.hc .rs{display:flex;gap:2px;height:4px}.hc .rs i{width:4px;height:4px;border-radius:50%;background:var(--pos)}
.app.m .heat{grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--t3)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend .s3{display:inline-flex;gap:2px}.legend .s3 i{width:15px;height:13px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:800;font-style:normal;color:var(--t1)}
.legend .pd{width:6px;height:6px;border-radius:50%;background:var(--pos)}
/* ダメージ計算 */
.vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap}.who small{display:block;font-size:11px;color:var(--t3);white-space:nowrap}
.arrow{color:var(--t4)}
.mvc{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;background:var(--well-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.res{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-top:12px}
.big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.big small{font-size:13px;font-weight:700;color:var(--t2);margin:0 2px}
.vd{font-size:12.5px;font-weight:750;padding:3px 9px;border-radius:8px;background:var(--well-2)}
.vd em{font-style:normal;color:var(--t3);margin-left:5px;font-weight:650}
.distrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:end;margin-top:10px}
.distrow .k{font-size:11px;color:var(--t3);line-height:1.25}.distrow .k small{display:block;color:var(--t4);font-size:10px}
.dist{display:flex;align-items:flex-end;gap:2px;height:24px}
.dist i{flex:1;min-width:0;border-radius:2px;background:rgba(var(--c1),.45)}.dist i.ko{background:rgb(var(--c1))}
.hp{position:relative;height:6px;border-radius:3px;background:rgba(127,135,160,.18);margin-top:10px;overflow:hidden}
.hp .rest{position:absolute;inset:0 auto 0 0;background:var(--pos);opacity:.6}
.hp .rng{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(var(--c1),.9) 0 4px,rgba(var(--c1),.5) 4px 8px)}
.cond{font-size:11.5px;color:var(--t3);margin-top:8px}
.app.m .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
/* V3.3：スマホの分析の部品は、補足の文字を1px大きく、行間と上下の余白を少し広く（大きな数字はそのまま） */
.app.m .mod.an{padding:14px 14px 15px}
.app.m .an .mh{font-size:13px;margin-bottom:12px}
.app.m .an .mh .kick{font-size:11px}
.app.m .an .who small{font-size:12px;line-height:1.45}
/* 攻撃側と受ける側を1行ずつに（条件の文が細かく折れないように） */
.app.m .an .vs{grid-template-columns:minmax(0,1fr);gap:4px}
.app.m .an .vs .arrow{transform:rotate(90deg);width:16px;margin-left:8px;height:14px;display:grid;place-items:center}
.app.m .an .vs .who{min-width:0}.app.m .an .vs .who>span{min-width:0}
.app.m .an .vs .who small{overflow:hidden;text-overflow:ellipsis}
.app.m .an .vs .mvc{margin-top:6px}
.app.m .an .who b{font-size:14px}
.app.m .an .mvc{font-size:13px}
.app.m .an .vd{font-size:13px}.app.m .an .vd em{font-size:12.5px}
.app.m .an .res{margin-top:14px}
.app.m .an .distrow{margin-top:12px;gap:12px}
.app.m .an .distrow .k{font-size:12px;line-height:1.45}.app.m .an .distrow .k small{font-size:11px}
.app.m .an .cond{font-size:12.5px;line-height:1.6;margin-top:10px}
.app.m .an .lad .w{font-size:13px}.app.m .an .lad .note,.app.m .an .lad .ticks{font-size:11px}
.app.m .an .legend{font-size:12px;line-height:1.5}
.app.m .mvc{grid-column:1/-1;margin:4px 0 0;justify-self:start}
/* 素早さの並び */
.lad{display:grid;grid-template-columns:7.4em minmax(0,1fr) 2.2em 1.3em;column-gap:8px;row-gap:3px;align-items:center}
.lad .w{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;font-weight:650}
.lad .w span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lad .trk{position:relative;height:26px;display:flex;align-items:center}
.lad .trk::before{content:'';position:absolute;left:0;right:0;height:2px;border-radius:1px;background:var(--well-2)}
.lad .bar{position:relative;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(var(--c1),.3),rgb(var(--c1)))}
.lad .v{font-size:12.5px;font-weight:800;text-align:right}
.lad .tie{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:12px;font-weight:800;color:var(--t2);background:var(--well-2)}
.lad .tie:empty{background:none}
.lad .ticks{grid-column:2;display:flex;justify-content:space-between;font-size:10px;color:var(--t4)}
.lad .note{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--t3)}
.app.m .lad{grid-template-columns:6.4em minmax(0,1fr) 2.1em 1.3em}
.app.m .lad .w{font-size:12px}
/* 対戦の記録 */
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.oc{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;align-content:center;background:rgba(69,199,150,.13);color:var(--pos)}
.oc b{font-size:14.5px;font-weight:850;letter-spacing:.06em;line-height:1.1}.oc small{font-size:10.5px;font-weight:700}
.tms{display:flex;flex-direction:column;gap:6px;min-width:0}
.tm{display:flex;align-items:center;gap:8px}
.tm .lb{width:2.4em;font-size:11px;color:var(--t3);flex:none}
.tm .row{display:flex;gap:3px}
.tm .left{font-size:11px;color:var(--t3)}
.rt{text-align:right;line-height:1.25}.rt b{display:block;font-size:18px;font-weight:800}.rt .d{font-size:12px;font-weight:750;color:var(--pos)}.rt small{display:block;font-size:10.5px;color:var(--t3)}
.app.m .rec{grid-template-columns:auto 1fr}
.app.m .rt{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;text-align:left;padding-top:8px;box-shadow:inset 0 1px 0 var(--sep)}
.app.m .rt small{margin-left:auto}

/* =====================================================================
   5. 右の列（いまのサイトと同じ：検索・すぐ使う・表示）
   ===================================================================== */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;background:var(--sheet);color:var(--t3);font-size:14px}
.app.bgimg .search,.app.bgimg .pnl{background:var(--sheet-img)}
.pnl{background:var(--sheet);border-radius:20px;padding:14px 6px 8px}
.pnl h2{font-size:16px;font-weight:800;margin:0 12px 6px;display:flex;align-items:center}
.pnl h2 small{margin-left:auto;font-size:11.5px;font-weight:550;color:var(--t3)}
.ql{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px}
.ql:hover{background:var(--hover)}
.ql .q{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--well-2);color:var(--t2);flex:none}
.ql b{display:block;font-size:14px;font-weight:700}.ql small{display:block;font-size:12px;color:var(--t3)}
.foot{font-size:11.5px;color:var(--t4);padding:0 12px;line-height:1.7}
.app.bgimg .foot{color:var(--t2)}
.bgp{padding:2px 10px 8px}
.pre{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pre button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:650;color:var(--t3);min-width:0}
.pre button[aria-checked=true]{color:var(--t1)}
.sw{width:100%;aspect-ratio:1;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(127,135,160,.2)}
.pre button[aria-checked=true] .sw{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--brand)}
.sw.add{display:grid;place-items:center;color:var(--t3);background:var(--well)}
.rng{margin-top:14px}
.rng label{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:4px}
.rng output{color:var(--t3);font-weight:550}
input[type=range]{width:100%;accent-color:var(--brand);margin:0;height:28px}
.hint{display:flex;gap:7px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--t3)}
.hint i{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}

/* =====================================================================
   6. スマホ：上は小さく（下にスクロールで隠れる）、下のタブに投稿ボタン
   ===================================================================== */
.app.m .fh{padding-top:var(--sat);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.app.m.top-hide .fh{transform:translateY(calc(-100% + 0px))}
.app.m .mt-row{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 6px}
.app.m .mt-row .mk{width:24px;height:24px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--t2)}
.ib:hover,.ib:active{background:var(--hover)}
.app.m .tabs{height:44px}
.app.m .feed{padding-bottom:calc(var(--sab) + 88px)}
.app.m .cmp{display:none}
.app.m .post{padding:12px 14px 4px;column-gap:10px;grid-template-columns:40px minmax(0,1fr)}
.app.m .av{width:40px;height:40px}
.app.m .post::after{left:64px;right:14px}
.app.m .acts{max-width:none}
.app.m .act{height:44px}
.nav{display:none}
.app.m .nav{display:flex;align-items:center;gap:2px;position:absolute;z-index:30;left:10px;right:10px;bottom:calc(var(--sab) + 6px);height:56px;padding:4px;border-radius:20px;box-shadow:var(--hl),0 8px 22px -8px rgba(0,0,0,.4)}
.app.m[data-theme=dark] .nav{background:rgba(30,32,42,.9);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.app.m[data-theme=light] .nav{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--hl),0 6px 20px -8px rgba(22,26,44,.22)}
.nav a{flex:1;min-width:0;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;font-size:10px;font-weight:600;color:var(--t3);position:relative;white-space:nowrap}
.nav a svg.i{width:22px;height:22px}
.nav a[aria-current=page]{color:var(--t1);background:var(--well-2)}
.nav a[aria-current=page] svg{color:var(--brand-tx)}
.nav a .bd{position:absolute;top:5px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.nav-post{flex:none;width:48px;height:48px;margin-left:2px;display:grid;place-items:center;position:relative;color:#fff}
.nav-post svg.hx{position:absolute;inset:0;width:48px;height:48px}
.nav-post svg.i{position:relative;width:20px;height:20px}
.nav-post:active{transform:scale(.94)}
.scrim{position:absolute;inset:0;z-index:50;background:rgba(5,6,10,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--raised);border-radius:26px 26px 0 0;box-shadow:var(--hl),var(--lift);padding:10px 18px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--t4);opacity:.6;margin:0 auto 12px}
.sheet h2{font-size:17px;font-weight:750;margin:0 0 12px;display:flex;align-items:center}
.sheet h2 .ib{margin-left:auto;margin-right:-10px}
.sheet textarea{width:100%;min-height:120px;border:0;outline:0;resize:none;background:var(--well);border-radius:16px;padding:14px;font-size:16px;line-height:1.55;color:var(--t1)}
.app:not(.m) .scrim,.app:not(.m) .sheet{display:none}
</style>
</head>
<body>
<div class="pv" role="toolbar" aria-label="見本の操作（本番には出ません）">
  <span class="tag">見本 V3.3</span>
  <div class="g" id="pv-v" role="group" aria-label="表示する形"></div>
  <div class="g" id="pv-g" role="group" aria-label="ゲームの例（作りの確認）"></div>
  <span class="sp"></span>
  <button class="x" id="pv-vis" aria-pressed="false" title="見た目だけで動かない部品に点線を付ける">見た目だけの部品</button>
  <button class="x" id="pv-notes" aria-pressed="false">設計メモ</button>
</div>
<aside class="notes" id="notes" aria-label="設計メモ"></aside>
<div class="stage" id="stage">
 <div class="app" id="app" data-theme="dark">
  <div class="bg atmos" id="bg"></div><div class="bg-img" id="bgimg"></div>
  <div class="scroll" id="scroll"><div class="d-grid">
    <nav class="rail" aria-label="メニュー" id="rail"></nav>
    <main class="feed" id="feed"></main>
    <aside class="side" id="side" aria-label="すぐ使う・表示"></aside>
  </div></div>
  <nav class="nav" id="nav" aria-label="メニュー"></nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"></section>
 </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const TYPES=[['normal','ノ','ノーマル','#9A9A8E'],['fire','炎','ほのお','#E57A3A'],['water','水','みず','#4C8FE6'],['electric','電','でんき','#E7C23C'],['grass','草','くさ','#5DB65A'],['ice','氷','こおり','#6CC7D0'],['fighting','闘','かくとう','#C9524A'],['poison','毒','どく','#A15CB8'],['ground','地','じめん','#C49A4E'],['flying','飛','ひこう','#8C95E8'],['psychic','超','エスパー','#E86A8E'],['bug','虫','むし','#98B03A'],['rock','岩','いわ','#B4A46A'],['ghost','霊','ゴースト','#7A62A8'],['dragon','竜','ドラゴン','#7366E8'],['dark','悪','あく','#6E625C'],['steel','鋼','はがね','#8495A8'],['fairy','妖','フェアリー','#D97FAF']];
const TC={};TYPES.forEach(t=>TC[t[0]]=t);
/* タイプ相性（ゲームの決まり＝事実。1倍以外だけ） */
const CHART={normal:{rock:.5,ghost:0,steel:.5},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},

 ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},
 poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},

 bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},
 ghost:{normal:0,psychic:2,ghost:2,dark:.5},dragon:{dragon:2,steel:.5,fairy:0},dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},
 steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5}};
const eff=(a,ds)=>ds.reduce((m,d)=>m*((CHART[a]||{})[d]??1),1);
/* 記号の形（ゲームごと）。どれも 96×96 の箱・外わく・2色の斜め塗り分けで、大きさと太さをそろえる */
function hexSigil(e){const R=40,P=f=>e.stats.map((v,i)=>{const r=R*f(v),t=-Math.PI/2+i*Math.PI/3;return (r*Math.cos(t)).toFixed(1)+','+(r*Math.sin(t)).toFixed(1)}).join(' ');
  return `<svg viewBox="-48 -48 96 96" aria-hidden="true"><polygon points="${P(()=>1)}" fill="none" stroke="rgb(${e.c1})" stroke-opacity=".3" stroke-width="2.6" stroke-linejoin="round"/><polygon points="${P(v=>Math.max(.15,Math.min(1,v/150)))}" fill="url(#g-${e.key})" stroke="rgb(${e.c2})" stroke-width="3.4" stroke-linejoin="round"/></svg>`}
function diaSigil(e){const R=40,ax=[[0,-1],[1,0],[0,1],[-1,0]],P=f=>e.stats.map((v,i)=>((R*f(v))*ax[i][0]).toFixed(1)+','+((R*f(v))*ax[i][1]).toFixed(1)).join(' ');
  return `<svg viewBox="-48 -48 96 96" aria-hidden="true"><polygon points="${P(()=>1)}" fill="none" stroke="rgb(${e.c1})" stroke-opacity=".3" stroke-width="2.6" stroke-linejoin="round"/><polygon points="${P(v=>Math.max(.18,Math.min(1,v/10)))}" fill="url(#g-${e.key})" stroke="rgb(${e.c2})" stroke-width="3.4" stroke-linejoin="round"/></svg>`}
const PACKS={
 pokechamp:{id:'pokechamp',name:'ポケモンチャンピオンズ',short:'ポケチャン',color:'#E8B931',sigil:hexSigil,

   ashi:['アシレーヌ','Primarina',['water','fairy'],[80,74,74,60,116,126]],armor:['アーマーガア','Corviknight',['flying','steel'],[98,87,105,67,85,53]],
   wind:['ウインディ','Arcanine',['fire'],[90,110,80,95,80,100]],kai:['カイリュー','Dragonite',['dragon','flying'],[91,134,95,80,100,100]],
   dpt:['ドラパルト','Dragapult',['dragon','ghost'],[88,120,75,142,75,100]],mimi:['ミミッキュ','Mimikyu',['ghost','fairy'],[55,90,80,96,105,50]]},
  ent(k){const [n,en,t,st]=this.raw[k];return {key:'pc-'+k,id:k,n,en,stats:st,speed:st[3],types:t,c1:rgb(TC[t[0]][3]),c2:rgb(TC[t[1]||t[0]][3]),sub:t.map(x=>TC[x][2]).join('・')}},
  /* このゲームだけの分析：タイプごとの「弱い（2倍以上）」「受けられる（半分以下）」の数 */
  coverage(ids){return TYPES.map(([k,ab,name])=>{let w=0,r=0;ids.forEach(id=>{const x=eff(k,this.ent(id).types);if(x>1)w++;else if(x<1)r++});return {k,ab,name,w,r}})}},

function defsHTML(){let d='';for(const pk of Object.values(PACKS))for(const k of Object.keys(pk.raw)){const e=pk.ent(k);d+=`<linearGradient id="g-${e.key}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(${e.c1})"/><stop offset=".52" stop-color="rgb(${e.c1})"/><stop offset=".52" stop-color="rgb(${e.c2})"/><stop offset="1" stop-color="rgb(${e.c2})"/></linearGradient>`}
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${d}</defs></svg>`}
/* 記号の大きさは4段だけ：xs 20・s 24・m 32・l 40（角の丸みは大きさの3割） */
const sig=(pk,k,size,extra)=>{const e=pk.ent(k);return `<span class="sig ${size}${extra?' '+extra:''}" style="--c1:${e.c1}" role="img" aria-label="${e.n}">${pk.sigil(e)}</span>`};
/* 名前のチップ（決定 D4：kfold・前後の区切り・#と@は見ない・同じ名前は1回） */
const SMALL={'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ヮ':'ワ','ヵ':'カ','ヶ':'ケ'};
const kfold=s=>[...s].map(ch=>{const c=ch.charCodeAt(0);const k=(c>=0x3041&&c<=0x3096)?String.fromCharCode(c+0x60):ch;return SMALL[k]||k}).join('');
const edge=ch=>!!ch&&/[゠-ヿA-Za-z0-9]/.test(ch);
function rich(pk,raw){const out=[],used=new Set();
  for(const part of raw.split(/([#＃][^\s#＃@＠]+|[@＠][A-Za-z0-9_]+)/)){if(!part)continue;
    if(/^[#＃@＠]/.test(part)){out.push(`<span class="ht">${esc(part)}</span>`);continue}
    const f=kfold(part),hits=[];
    for(const k of Object.keys(pk.raw)){const e=pk.ent(k),jn=kfold(e.n);let from=0,i;
      while((i=f.indexOf(jn,from))>=0){from=i+1;if(edge(part[i-1])||edge(part[i+jn.length]))continue;hits.push({i,len:jn.length,k})}}
    hits.sort((a,b)=>a.i-b.i);let pos=0;
    for(const h of hits){if(h.i<pos||used.has(h.k))continue;used.add(h.k);const e=pk.ent(h.k);
      out.push(esc(part.slice(pos,h.i)),`<a href="#" class="ent" style="--c1:${e.c1};--c2:${e.c2}" data-toast="「${e.n}」のページへ（見本なので移動しません）" data-vis><i class="dm" aria-hidden="true"></i>${esc(part.slice(h.i,h.i+h.len))}</a>`);pos=h.i+h.len}
    out.push(esc(part.slice(pos)))}
  return out.join('')}
const modHead=(icon,title,right,an)=>`<div class="mh">${an?'<span class="kick">分析</span>':''}${S(icon,15)}<b>${title}</b>${right?`<span class="r">${right}</span>`:''}</div>`;

/* ---- 構造の部品（情報をそのまま見せる）：パーティ・チーム、対戦の記録 ---- */
function mTeam(pk,m){return `<div class="mod" data-mod="team" role="group" aria-label="${pk.words.team} ${esc(m.name)}">
  ${modHead('team',`<span class="pt">${esc(m.name)}</span>`,`${S('eye',13)}${pk.words.disclose}`)}
  <div class="party" data-n="${m.ids.length}" style="--n:${m.ids.length}">${m.ids.map(k=>{const e=pk.ent(k);return `<a href="#" class="mem" aria-label="${e.n}（${e.sub}）" data-toast="「${e.n}」のページへ（見本）" data-vis>${sig(pk,k,'l')}<span class="nm">${e.n}</span></a>`}).join('')}</div>
  <div class="mf"><span>${m.fmt}・${m.ids.length}${pk.words.unit}</span><span class="sepd">·</span>${m.date}に共有した時点の内容<a href="#" class="lk" data-toast="空いている枠に写します（見本）" data-vis>${pk.words.use}${S('chev',13)}</a></div></div>`}
function mRecord(pk,m){const row=(lb,ids,down)=>`<div class="tm"><span class="lb">${lb}</span><span class="row">${ids.map(k=>sig(pk,k,'s',down.includes(k)?'down':'')).join('')}</span><span class="left num">残り${ids.length-down.length}</span></div>`;
  return `<div class="mod" data-mod="record" role="group" aria-label="対戦の記録">
  ${modHead('target',m.fmt,'本人の記録')}
  <div class="rec"><div class="oc"><b>WIN</b><small>勝ち</small></div><div class="tms">${row('自分',m.mine,m.dm)}${row('相手',m.opp,m.do)}</div>
   ${m.rate?`<div class="rt"><b class="num">${m.rate.toLocaleString()}</b><span class="d num">+${m.diff}</span><small>レート・自己申告</small></div>`:`<div class="rt"><b class="num">${m.score}</b><small>${m.scoreNote}</small></div>`}</div></div>`}

/* ---- 分析の部品（数字を図で見せる）：ダメージ、速さの並び、弱点の重なり ---- */
function mCalc(pk,m){const A=pk.ent(m.a),D=pk.ent(m.d),rolls=[...Array(16)].map((_,i)=>m.min+(m.max-m.min)*i/15);
  return `<div class="mod an" data-mod="calc" role="group" aria-label="ダメージ計算" style="--c1:${m.ac}">
  ${modHead('calc','ダメージ計算','シングル',1)}
  <div class="vs"><div class="who">${sig(pk,m.a,'m')}<span><b>${A.n}</b><small>${m.aCond}</small></span></div><span class="arrow">${S('arrow',16)}</span><div class="who">${sig(pk,m.d,'m')}<span><b>${D.n}</b><small>${m.dCond}</small></span></div><span class="mvc"><span class="dot" style="background:rgb(${m.ac})"></span>${m.action}</span></div>
  <div class="res"><span class="big num">${m.min.toFixed(1)}<small>〜</small>${m.max.toFixed(1)}<small>%</small></span><span class="vd">${m.verdict}<em class="num">${m.prob}</em></span></div>
  <div class="distrow"><span class="k">乱数16段階<small>濃い＝50%以上</small></span><span class="dist" role="img" aria-label="16段階のうち${rolls.filter(r=>r>=50).length}段階が50%以上">${rolls.map(r=>`<i class="${r>=50?'ko':''}" style="height:${30+r/m.max*70}%"></i>`).join('')}</span></div>
  <div class="hp" aria-hidden="true"><span class="rest" style="width:${100-m.max}%"></span><span class="rng" style="left:${100-m.max}%;width:${m.max-m.min}%"></span></div>
  <div class="cond">${m.note}</div></div>`}
function mSpeed(pk,m){const W=pk.words,asc=W.speedAsc,es=m.ids.map(k=>pk.ent(k)).sort((a,b)=>asc?a.speed-b.speed:b.speed-a.speed);
  /* 棒が長いほど速い（フレームのように小さいほど速いゲームは向きを逆にする） */
  const x=v=>Math.max(3,(asc?(m.max-v):(v-m.min))/(m.max-m.min)*100),tied=e=>es.some(o=>o!==e&&Math.abs(o.speed-e.speed)<=W.tie);
  const ticks=asc?[...m.ticks].reverse():m.ticks;
  return `<div class="mod an" data-mod="speed" role="group" aria-label="${W.speed}">
  ${modHead('bolt',W.speed,W.speedNote,1)}
  <div class="lad">${es.map(e=>`<span class="w">${sig(pk,e.id,'s')}<span>${e.n}</span></span><span class="trk" style="--c1:${e.c1}"><span class="bar" style="width:${x(e.speed)}%"></span></span><span class="v num">${e.speed}</span><span class="tie"${tied(e)?` title="差が${W.tie||'なし'}以内"`:' aria-hidden="true"'}>${tied(e)?'≈':''}</span>`).join('')}
   <span></span><span class="ticks num" aria-hidden="true">${ticks.map(t=>`<span>${t}</span>`).join('')}</span><span></span><span></span>
   ${es.some(tied)?`<span class="note"><span class="tie">≈</span>${W.tie?'差が1以内（ほぼ同じ）':'同じ値'}</span>`:''}</div></div>`}
function mCover(pk,m,p){if(!pk.coverage)return '';const U2=pk.words.unit,cells=pk.coverage(m.ids);
  /* 計算は V3.2 と同じ（coverage）。見せ方だけ：重なりの大きい順（同じなら受けられる数の少ない順）に上位を要点に */
  const weak=cells.filter(c=>c.w>=2).sort((a,b)=>b.w-a.w||a.r-b.r),top=weak.slice(0,4),rest=weak.length-top.length,max=weak.length?weak[0].w:0;
  const safe=cells.filter(c=>!c.w&&c.r>=3),open=!!(ST.covOpen&&ST.covOpen[p.id]),id='cov-'+p.id;
  const warn=weak.length?`${weak.length}タイプで${U2==='匹'?'2匹':'2'+U2}以上が同時に弱い${max>=3?`（最大${max}${U2}）`:''}`:'2'+U2+'以上が同時に弱いタイプはない';
  return `<div class="mod an" data-mod="cover" role="group" aria-label="弱点の重なり">
  ${modHead('heat','弱点の重なり',`${m.ids.length}${U2}・タイプ相性だけ`,1)}
  <p class="cv-warn${weak.length?'':' ok'}" role="note">${S(weak.length?'warn':'check',15)}<span>${warn}</span></p>
  ${top.length?`<div class="cv-top">${top.map(c=>`<span class="cv-t w${Math.min(3,c.w)}" title="${c.name}：弱い${c.w}${U2}・受けられる${c.r}${U2}"><b>${c.ab}</b><span>${c.name}</span><em class="num">${c.w}${U2}</em></span>`).join('')}${rest>0?`<span class="cv-more">ほか${rest}タイプ</span>`:''}</div>`:''}
  <button class="cv-tg" data-cov="${p.id}" aria-expanded="${open}" aria-controls="${id}">${open?'閉じる':'18タイプすべてを見る'}${S('down',15)}</button>

  return c.toDataURL('image/jpeg',.82)}

const NOTES=`<h2>設計メモ：フィード V3.3</h2><p>くわしくは <code>docs/social-redesign/v3.3/design-notes.md</code>。V3.2 から変えたのは5つだけ：ダークの投稿欄と記号の見やすさ／左のメニューの間隔／スマホのダメージ計算の小さな文字／弱点の重なりは要点だけにして、18タイプは開いて見る／スマホのカテゴリは右端をうすくして横に動かせると分かるように。</p>
<h3>いまのサイトから残したもの</h3><p>左のメニュー（ホーム・検索・ツール・パーティ・メッセージ）と「相性を調べる」の大きなボタン／みんな・フォロー中の2等分のタブ／小さな投稿欄／投稿の並び（返信→リポスト→いいね→ブックマーク→共有）／右の列（検索・すぐ使う）／スマホの下のタブ。</p>
<h3>投稿の3つの種類</h3><p>ふつう（文字だけ・箱なし）／構造（パーティ・チーム・対戦の記録を、記号でそのまま見せる）／分析（ダメージ・速さの並び・弱点の重なりを、小さな図で見せる）。どれも同じ投稿の形で、中の部品だけが変わる。</p><h3>ゲームのパック</h3><p>上の「架空のゲーム（構造の確認）」で、同じ部品が別のゲームのデータ・記号・言葉で動くことを確かめられる（実在のゲームではない）。</p>
<h3>変えたこと</h3><p>投稿ごとの枠線つきの箱をやめ、1枚の読む面に並べる（区切りは本文の列から細く）／スマホの投稿ボタンを下のタブの中へ（投稿の上に重ならない）／上のバーは下にスクロールすると隠れる。</p>
<h3>見本の数値</h3><p>ダメージ・確率・レートは見本。タイプ相性と種族値は実際のゲームの値。</p>`;

function render(keep){const sc=document.getElementById('scroll'),y=sc.scrollTop,app=document.getElementById('app'),st=document.getElementById('stage');
  app.dataset.theme=theme();app.classList.toggle('m',isM());
  st.classList.toggle('phone',isM()&&innerWidth>=480);st.classList.toggle('bare',isM()&&innerWidth<480);
  document.getElementById('rail').innerHTML=railHTML();document.getElementById('feed').innerHTML=feedHTML();document.getElementById('side').innerHTML=isM()?'':sideHTML();
  document.getElementById('nav').innerHTML=navHTML();
  const sh=document.getElementById('sheet');sh.innerHTML=sheetHTML();sh.classList.toggle('on',!!ST.sheet);document.getElementById('scrim').classList.toggle('on',!!ST.sheet);
  document.getElementById('pv-v').innerHTML=[['dd','PC・ダーク'],['dl','PC・ライト'],['md','スマホ・ダーク'],['ml','スマホ・ライト']].map(([k,t])=>`<button data-v="${k}" aria-pressed="${ST.v===k}">${t}</button>`).join('');
  document.getElementById('pv-g').innerHTML=[['pokechamp','ポケチャン'],['arena','架空のゲーム（構造の確認）']].map(([k,t])=>`<button data-g="${k}" aria-pressed="${ST.g===k}">${t}</button>`).join('');
  document.body.classList.toggle('show-vis',ST.vis);document.getElementById('pv-vis').setAttribute('aria-pressed',ST.vis);
  const n=document.getElementById('notes');n.classList.toggle('on',ST.notes);n.innerHTML=NOTES;document.getElementById('pv-notes').setAttribute('aria-pressed',ST.notes);
  document.querySelectorAll('.mk').forEach(e=>e.style.setProperty('--logo',`url(${LOGO})`));
  applyBg();POSTS.forEach(p=>delete p.isNew);catsSync(true);
  sc.scrollTop=keep?y:0;app.classList.remove('top-hide');LASTY=sc.scrollTop;
  try{history.replaceState(null,'','?v='+ST.v+(ST.g!=='pokechamp'?'&g='+ST.g:'')+(ST.bg.p!=='atmos'?'&bg='+ST.bg.p:''))}catch(e){}}
let TT;function toast(t){const el=document.getElementById('toast');el.innerHTML=`<b>見本</b><span>${esc(t)}</span>`;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>el.classList.remove('on'),2400)}
function post(){const text=ST.draft.trim();if(!text)return;POSTS.unshift({id:Date.now(),g:ST.g,u:'me',t:'たった今',cat:ST.dcat,text,f:1,isNew:1});ST.draft='';ST.dcat=null;ST.open=false;ST.sheet=null;ST.menu=false;ST.cat='all';render();toast('この画面の中だけに追加しました。読み直すと消えます')}
function typed(w){const t=document.getElementById(w+'-t');ST.draft=t.value;const len=[...t.value].length,c=document.getElementById(w+'-c');c.hidden=len<=120;c.textContent=140-len;c.classList.toggle('over',len>140);document.getElementById(w+'-go').disabled=!(len&&len<=140);
  if(w==='d'){t.style.height='auto';t.style.height=Math.min(180,t.scrollHeight)+'px';if(len&&!ST.open){ST.open=true;document.querySelector('.cmp').classList.add('open')}}}

document.addEventListener('click',e=>{const T=s=>e.target.closest(s);let x;
  if((x=T('[data-v]'))){ST.v=x.dataset.v;ST.sheet=null;ST.menu=false;render();return}
  if((x=T('[data-g]'))){ST.g=x.dataset.g;ST.cat='all';render();return}
  if(T('#pv-vis')){ST.vis=!ST.vis;render(true);return}
  if(T('#pv-notes')){ST.notes=!ST.notes;render(true);return}
  if((x=T('[data-toast]'))){e.preventDefault();toast(x.dataset.toast);return}
  if((x=T('[data-cov]'))){const id=x.dataset.cov;ST.covOpen[id]=!ST.covOpen[id];render(true);document.querySelector(`[data-cov="${id}"]`)?.focus({preventScroll:true});return}
  if((x=T('[data-tab]'))){ST.tab=x.dataset.tab;render(true);return}
  if((x=T('[data-cat]'))){ST.cat=x.dataset.cat;render(true);return}
  if((x=T('#d-cat,#m-cat'))){const w=x.id[0];ST.menu=ST.menu===w?false:w;render(true);document.querySelector('.menu.on button')?.focus();return}
  if((x=T('[data-dcat]'))){ST.dcat=x.dataset.dcat||null;const w=ST.menu;ST.menu=false;render(true);document.getElementById(w+'-cat')?.focus();return}
  if(ST.menu&&!T('.menu')){ST.menu=false;render(true)}
  if(T('#d-go')||T('#m-go')){post();return}
  if(T('#nav-post')){ST.sheet='compose';render(true);setTimeout(()=>document.getElementById('m-t')?.focus(),300);return}
  if(T('#m-bg')){ST.sheet='bg';render(true);return}
  if(T('[data-close]')||T('#scrim')){ST.sheet=null;ST.menu=false;render(true);return}
  if((x=T('[data-like]'))){const p=POSTS.find(p=>p.id==x.dataset.like);p.liked=!p.liked;render(true);return}
  if((x=T('[data-bm]'))){const p=POSTS.find(p=>p.id==x.dataset.bm);p.bm=!p.bm;render(true);toast(p.bm?'ブックマークに追加しました':'ブックマークから削除しました');return}
  if((x=T('[data-pre]'))){if(x.dataset.pre==='img'){ST.bg.p='img';if(!ST.bg.img)ST.bg.img=sample()}else ST.bg.p=x.dataset.pre;render(true);return}
  if(T('[data-sample]')){ST.bg.img=sample();ST.bg.p='img';render(true);return}
});
document.addEventListener('focusin',e=>{if(e.target.id==='d-t'&&!ST.open){ST.open=true;e.target.closest('.cmp').classList.add('open')}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='d-t')return typed('d');if(t.id==='m-t')return typed('m');
  if(t.id==='r-k'){ST.bg.k=+t.value;document.getElementById('o-k').textContent=t.value+'%';applyBg()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-file]')&&t.files[0]){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ST.bg.img=c.toDataURL('image/jpeg',.85);ST.bg.p='img';render(true)};im.src=rd.result};rd.readAsDataURL(t.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ST.menu){const w=ST.menu;ST.menu=false;render(true);document.getElementById(w+'-cat')?.focus()}else if(ST.sheet){ST.sheet=null;render(true)}else if(ST.notes){ST.notes=false;render(true)}}});
addEventListener('resize',()=>render(true));
/* カテゴリの横の並び：端のうすさを今の位置に合わせ、選んでいるものは見える位置へ */
function catsFade(c){const l=c.scrollLeft>2,r=c.scrollLeft+c.clientWidth<c.scrollWidth-2;c.dataset.fade=[l?'l':'',r?'r':''].join(' ').trim()}
function catsSync(reveal){document.querySelectorAll('.cats').forEach(c=>{if(reveal){const on=c.querySelector('[aria-pressed=true]');if(on){const L=on.offsetLeft-c.offsetLeft,Rr=L+on.offsetWidth;if(Rr>c.scrollLeft+c.clientWidth-36)c.scrollLeft=Rr-c.clientWidth+36;else if(L<c.scrollLeft+24)c.scrollLeft=Math.max(0,L-24)}}catsFade(c);if(!c.dataset.b){c.dataset.b=1;c.addEventListener('scroll',()=>catsFade(c),{passive:true})}})}
let LASTY=0;
document.getElementById('scroll').addEventListener('scroll',e=>{const y=e.target.scrollTop,app=document.getElementById('app');
  if(!isM()){app.classList.remove('top-hide');return}
  if(y>LASTY+6&&y>90)app.classList.add('top-hide');else if(y<LASTY-6||y<=90)app.classList.remove('top-hide');LASTY=y},{passive:true});
document.body.insertAdjacentHTML('afterbegin',defsHTML());
(()=>{const q=new URLSearchParams(location.search);const v=q.get('v');ST.v=['dd','dl','md','ml'].includes(v)?v:(innerWidth<700?'md':'dd');
  if(!v&&matchMedia('(prefers-color-scheme: light)').matches)ST.v=ST.v[0]+'l';
  const b=q.get('bg');if(['atmos','mesh','slate','noise'].includes(b))ST.bg.p=b;if(b==='img'){ST.bg.p='img';ST.bg.img=sample()}
  if(['pokechamp','arena'].includes(q.get('g')))ST.g=q.get('g');
  if(q.get('cov')==='1')POSTS.forEach(p=>{if((p.mods||[]).some(m=>m.k==='cover'))ST.covOpen[p.id]=true});
  render()})();
</script>
