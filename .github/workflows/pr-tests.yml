# テストだけ（公開しない）：プルリクエストと作業用のブランチで、組み立てとテストを動かす。
# 公開の deploy.yml とは別。合言葉（secrets）・本番の変数（vars）は使わない。Cloudflare には何もしない。
# サーバーのテストは D1 のまね（Node の SQLite）と、にせものの外のサービスで動く（tests/*.mjs）。
name: テストだけ（公開しない）

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 道具をそろえる
        run: |
          npm install --no-audit --no-fund
          for i in 1 2; do timeout 180 npx playwright install --with-deps chromium && break; echo "やり直し $i"; sleep 15; done || true
          npx playwright install chromium
      - name: 組み立て（検索向けページは本番でないアドレスで）
        env:
          SITE_URL: https://example.invalid
        run: |
          node tools/build.mjs
          python3 worker/build.py
          node tools/gen-pages.cjs
      - name: テスト
        run: node tests/run.mjs
