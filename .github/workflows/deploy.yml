# GitHub に上げる（main に push する）と自動で実行されます：
#   組み立て → テスト → サイトを Cloudflare Pages に公開 → サーバーを Cloudflare Workers に公開
# テストに1つでも失敗したら、公開はしません（今の公開版はそのまま残ります）。
name: 公開（テスト→サイト→サーバー）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 道具をそろえる
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 組み立て（サイト・サーバー・検索向けページ）
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          node tools/build.mjs
          python3 worker/build.py
          node tools/gen-pages.cjs

      - name: テスト
        run: node tests/run.mjs

      - name: 設定の確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          miss=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$D1_DATABASE_ID" ] && miss="$miss D1_DATABASE_ID"
          if [ -n "$miss" ]; then echo "::error::GitHub の Settings で次の設定が足りません:$miss（README の手順2を見てください）"; exit 1; fi

      # サイトは Cloudflare Pages（無料で公開の回数に実質上限なし）。アドレスは https://<PAGES_PROJECT>.pages.dev
      # 初回だけプロジェクトを作る（すでにあれば何もしない）。合言葉（API トークン）に「Cloudflare Pages：編集」の権限が必要
      - name: サイトを公開（Cloudflare Pages）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'pokechan-hub' }}
        run: |
          npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main || echo "（プロジェクトはすでにあります）"
          npx --yes wrangler@3 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true --commit-message="GitHub ${{ github.sha }}"
      # 画像つき投稿の画像の置き場。Cloudflare で R2 が使えるなら R2、使えなければサーバーの D1 に保存する（どちらでも動く）
      - name: 画像の置き場（R2）を確かめる（失敗しても公開は止めない）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 r2 bucket create pokechan-media 2>&1 | tail -3 || true
          if npx --yes wrangler@3 r2 bucket list 2>/dev/null | grep -q 'pokechan-media'; then
            echo "R2_OK=1" >> "$GITHUB_ENV"; echo "画像は R2 に保存します"
          else
            echo "R2 は使えないので、画像はサーバーの D1 に保存します"
          fi
      - name: サーバーの設定ファイルを作る
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME || 'pokechan-tap' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'pokechan-community' }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml <<TOML
          name = "${WORKER_NAME}"
          main = "worker/dist/worker.js"
          compatibility_date = "2025-01-01"
          # ダッシュボードで設定した値（合言葉などの Secrets）は消さずに残す
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "${D1_DATABASE_NAME}"
          database_id = "${D1_DATABASE_ID}"
          TOML
          if [ "$R2_OK" = "1" ]; then
          cat >> wrangler.toml <<TOML

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "pokechan-media"
          TOML
          fi

      - name: サーバーを公開（Cloudflare Workers）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
