name: Quick Access browser verification
on:
  push:
    branches: [verify/quick-access-tool-stars]
jobs:
  quick-access:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node tools/build.mjs
      - run: node tests/toolsguide.mjs
